baseURL = "https://tsuki126.github.io/"
theme = "hugo-bearblog"
title = "Tsuki126"
copyright = "Copyright © 2024, Tsuki126."
languageCode = "zh-CN"

enableRobotsTXT = true
hasCJKLanguage = true
enableGitInfo = true

[permalinks]
  professional = "/professional/:slug/"
  life = "/life/:slug/"
  daily = "/daily/:slug/"
  categories = "/categories/:slug/"
  tags = "/tags/:slug/"
  directions = "/directions/:slug/"
  tracks = "/tracks/:slug/"
  life_series = "/life/series/:slug/"
  stages = "/stages/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"
  direction = "directions"
  track = "tracks"
  stage = "stages"
  series = "series"
  life_series = "life_series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "安全工程师 · 企业安全体系 · AI 安全 · 云原生 · 数据安全"
  favicon = "images/favicon.svg"
  title = "Tsuki126"
  dateFormat = "2006-01-02"
  hideMadeWithLine = true
  enablePostNavigator = true
  motto = "探索未知，思考本质，实践真知"
  identity = "安全工程师，记录企业安全体系建设实践"
  focus = "最近在关注：AI 安全、使用 AI 推动企业安全体系建设，以及云安全与数据安全治理。"

[markup]
  [markup.highlight]
    style = "monokai"
    noClasses = false
    lineNos = false
    codeFences = true
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"]]
    [markup.goldmark.renderer]
      unsafe = true

[author]
  name = "Tsuki126"
  email = "tsukin126@gmail.com"

[[menus.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1

[[menus.main]]
  identifier = "index"
  name = "目录"
  url = "/overview/"
  weight = 2

[[menus.main]]
  identifier = "professional"
  name = "专业"
  url = "/professional/"
  weight = 3

[[menus.main]]
  identifier = "life"
  name = "生活"
  url = "/life/"
  weight = 4

[[menus.main]]
  identifier = "daily"
  name = "日常"
  url = "/daily/"
