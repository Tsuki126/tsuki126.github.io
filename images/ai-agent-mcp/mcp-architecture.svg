<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { fill: #1a1a2e; font-size: 13px; font-weight: 600; }
    .text-normal { fill: #1a1a2e; font-size: 12px; }
    .text-small { fill: #555; font-size: 11px; }
    .text-desc { fill: #666; font-size: 10.5px; }
    .text-white { fill: #fff; font-size: 11px; font-weight: 600; }
    .box-host { fill: #fef3e2; stroke: #e6c988; stroke-width: 1.5; rx: 8; }
    .box-client { fill: #d4e1f5; stroke: #88a8d0; stroke-width: 1.5; rx: 8; }
    .box-server { fill: #e8f0e8; stroke: #a0c8a0; stroke-width: 1.5; rx: 8; }
    .box-white { fill: #ffffff; stroke: #b0b8c8; stroke-width: 1; rx: 5; }
    .arrow { fill: none; stroke: #888; stroke-width: 1.2; marker-end: url(#arrowhead); }
    .layer-label { fill: #888; font-size: 10px; font-weight: 600; }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">MCP 协议架构：Host → Client → Server</text>

  <!-- Layer 1: Host -->
  <rect x="30" y="40" width="660" height="90" class="box-host"/>
  <rect x="30" y="40" width="660" height="26" fill="#fef3e2" rx="8"/>
  <rect x="30" y="60" width="660" height="6" fill="#fef3e2"/>
  <text x="360" y="58" text-anchor="middle" class="title">MCP Host — AI 应用程序</text>

  <!-- Host components -->
  <rect x="48" y="76" width="190" height="40" class="box-white"/>
  <text x="143" y="95" text-anchor="middle" class="text-normal" font-weight="600">Agent 运行时</text>
  <text x="143" y="109" text-anchor="middle" class="text-desc">Claude Desktop / IDE 插件 / 自定义 Agent</text>

  <rect x="260" y="76" width="200" height="40" class="box-white"/>
  <text x="360" y="95" text-anchor="middle" class="text-normal" font-weight="600">LLM 推理引擎</text>
  <text x="360" y="109" text-anchor="middle" class="text-desc">Claude / GPT / 其他模型</text>

  <rect x="482" y="76" width="190" height="40" class="box-white"/>
  <text x="577" y="95" text-anchor="middle" class="text-normal" font-weight="600">用户界面</text>
  <text x="577" y="109" text-anchor="middle" class="text-desc">聊天界面 / 编辑面板 / 命令行</text>

  <!-- Arrow Host → Client -->
  <line x1="360" y1="130" x2="360" y2="160" class="arrow"/>

  <!-- Layer 2: Client -->
  <rect x="30" y="165" width="660" height="85" class="box-client"/>
  <rect x="30" y="165" width="660" height="26" fill="#d4e1f5" rx="8"/>
  <rect x="30" y="185" width="660" height="6" fill="#d4e1f5"/>
  <text x="360" y="183" text-anchor="middle" class="title">MCP Client — 协议处理器</text>

  <rect x="48" y="200" width="200" height="36" class="box-white"/>
  <text x="148" y="218" text-anchor="middle" class="text-normal" font-weight="600">连接管理器</text>
  <text x="148" y="231" text-anchor="middle" class="text-desc">初始化握手 / 能力协商</text>

  <rect x="268" y="200" width="180" height="36" class="box-white"/>
  <text x="358" y="218" text-anchor="middle" class="text-normal" font-weight="600">请求路由</text>
  <text x="358" y="231" text-anchor="middle" class="text-desc">JSON-RPC 编码/解码</text>

  <rect x="468" y="200" width="204" height="36" class="box-white"/>
  <text x="570" y="218" text-anchor="middle" class="text-normal" font-weight="600">能力缓存</text>
  <text x="570" y="231" text-anchor="middle" class="text-desc">Tools / Resources / Prompts 列表</text>

  <!-- Arrow Client → Server -->
  <line x1="360" y1="250" x2="360" y2="280" class="arrow"/>
  <text x="372" y="268" class="text-small" fill="#888">JSON-RPC 2.0 (stdio / HTTP)</text>

  <!-- Layer 3: Server -->
  <rect x="30" y="285" width="660" height="100" class="box-server"/>
  <rect x="30" y="285" width="660" height="26" fill="#e8f0e8" rx="8"/>
  <rect x="30" y="305" width="660" height="6" fill="#e8f0e8"/>
  <text x="360" y="303" text-anchor="middle" class="title">MCP Server — 工具提供者</text>

  <rect x="48" y="320" width="100" height="50" class="box-white"/>
  <text x="98" y="339" text-anchor="middle" class="text-normal" font-weight="600">Tools</text>
  <text x="98" y="355" text-anchor="middle" class="text-desc">可执行函数</text>
  <text x="98" y="367" text-anchor="middle" class="text-desc">读写操作</text>

  <rect x="168" y="320" width="100" height="50" class="box-white"/>
  <text x="218" y="339" text-anchor="middle" class="text-normal" font-weight="600">Resources</text>
  <text x="218" y="355" text-anchor="middle" class="text-desc">URI 数据</text>
  <text x="218" y="367" text-anchor="middle" class="text-desc">只读查询</text>

  <rect x="288" y="320" width="100" height="50" class="box-white"/>
  <text x="338" y="339" text-anchor="middle" class="text-normal" font-weight="600">Prompts</text>
  <text x="338" y="355" text-anchor="middle" class="text-desc">模板</text>
  <text x="338" y="367" text-anchor="middle" class="text-desc">可复用指令</text>

  <!-- Server 2 -->
  <rect x="420" y="320" width="130" height="50" class="box-white"/>
  <text x="485" y="339" text-anchor="middle" class="text-normal" font-weight="600">SSH 服务器</text>
  <text x="485" y="355" text-anchor="middle" class="text-desc">执行远程命令</text>

  <!-- Server 3 -->
  <rect x="565" y="320" width="110" height="50" class="box-white"/>
  <text x="620" y="339" text-anchor="middle" class="text-normal" font-weight="600">SQLite DB</text>
  <text x="620" y="355" text-anchor="middle" class="text-desc">数据库查询</text>

  <!-- Layer labels on left -->
  <text x="18" y="85" class="layer-label">HOST</text>
  <text x="18" y="210" class="layer-label">CLIENT</text>
  <text x="18" y="335" class="layer-label">SERVER</text>
</svg>