<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ARTEX 运行闭环</title>
  <desc id="desc">图示目标经单一规划器生成持久 Intent，执行器经工具网关执行并把结果写入状态与证据，状态事件再唤醒规划器。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#53616d"/>
    </marker>
    <marker id="arrow-dash" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a6845"/>
    </marker>
    <style>
      .bg{fill:#fbfbfa}
      .zone{fill:#f6f7f8;stroke:#dfe3e7;stroke-width:1}
      .zoneLabel{font:600 13px "PingFang SC","Noto Sans CJK SC",sans-serif;fill:#6f7a84;letter-spacing:1.1px}
      .node{fill:#fff;stroke:#aeb7c0;stroke-width:1.15;rx:7}
      .model{fill:#eaf0f6;stroke:#55708c;stroke-width:1.15;rx:7}
      .state{fill:#e9f2ee;stroke:#4e7667;stroke-width:1.15;rx:7}
      .control{fill:#f7f0e7;stroke:#91693f;stroke-width:1.15;rx:7}
      .text{font:500 18px "PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17202a}
      .small{font:400 15px "PingFang SC","Noto Sans CJK SC",sans-serif;fill:#66717c}
      .label{font:500 14px "PingFang SC","Noto Sans CJK SC",sans-serif;fill:#5d6974}
      .line{fill:none;stroke:#53616d;stroke-width:1.45;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#8a6845;stroke-width:1.45;stroke-dasharray:7 5;marker-end:url(#arrow-dash)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>

  <text class="zoneLabel" x="54" y="46">ARTEX 运行闭环</text>
  <g transform="translate(820 34)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#53616d" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text class="label" x="44" y="5">直接流转</text>
    <line x1="136" y1="0" x2="170" y2="0" stroke="#8a6845" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arrow-dash)"/>
    <text class="label" x="180" y="5">状态回流</text>
  </g>

  <rect class="zone" x="44" y="66" width="1112" height="330" rx="8"/>
  <text class="zoneLabel" x="68" y="96">执行与反馈</text>

  <rect class="node" x="60" y="126" width="130" height="72"/>
  <text class="text" x="125" y="156" text-anchor="middle">Goal</text>
  <text class="small" x="125" y="181" text-anchor="middle">目标与授权范围</text>
  <rect class="model" x="250" y="126" width="150" height="72"/>
  <text class="text" x="325" y="156" text-anchor="middle">Planner × 1</text>
  <text class="small" x="325" y="181" text-anchor="middle">决定下一步</text>
  <rect class="state" x="460" y="126" width="160" height="72"/>
  <text class="text" x="540" y="156" text-anchor="middle">Intent 队列</text>
  <text class="small" x="540" y="181" text-anchor="middle">持久工作单元</text>
  <rect class="model" x="680" y="126" width="150" height="72"/>
  <text class="text" x="755" y="156" text-anchor="middle">Worker × N</text>
  <text class="small" x="755" y="181" text-anchor="middle">一次一条 Intent</text>
  <rect class="control" x="900" y="126" width="214" height="72"/>
  <text class="text" x="1007" y="156" text-anchor="middle">工具网关</text>
  <text class="small" x="1007" y="181" text-anchor="middle">规则、审批与审计</text>
  <path class="line" d="M190 162 H250"/>
  <path class="line" d="M400 162 H460"/>
  <path class="line" d="M620 162 H680"/>
  <path class="line" d="M830 162 H900"/>
  <text class="label" x="220" y="148" text-anchor="middle">拆解</text>
  <text class="label" x="430" y="148" text-anchor="middle">生成</text>
  <text class="label" x="650" y="148" text-anchor="middle">领取</text>
  <text class="label" x="865" y="148" text-anchor="middle">检查</text>

  <rect class="control" x="900" y="262" width="214" height="72"/>
  <text class="text" x="1007" y="292" text-anchor="middle">外部系统与工具</text>
  <text class="small" x="1007" y="317" text-anchor="middle">观察或副作用</text>
  <rect class="state" x="626" y="262" width="226" height="72"/>
  <text class="text" x="739" y="292" text-anchor="middle">状态与证据</text>
  <text class="small" x="739" y="317" text-anchor="middle">fact · finding · snapshot</text>
  <rect class="model" x="346" y="262" width="232" height="72"/>
  <text class="text" x="462" y="292" text-anchor="middle">事件去抖</text>
  <text class="small" x="462" y="317" text-anchor="middle">合并短时间内的状态变化</text>
  <path class="dash" d="M1007 198 V262"/>
  <path class="line" d="M900 298 H852"/>
  <path class="line" d="M626 298 H578"/>
  <text class="label" x="876" y="284" text-anchor="middle">返回</text>
  <text class="label" x="602" y="284" text-anchor="middle">触发</text>
  <path class="dash" d="M346 298 H325 V198"/>
  <text class="label" x="349" y="246" text-anchor="start">唤醒</text>

  <rect class="zone" x="44" y="426" width="1112" height="246" rx="8"/>
  <text class="zoneLabel" x="68" y="456">持久状态</text>
  <rect class="state" x="68" y="500" width="244" height="112"/>
  <text class="text" x="190" y="534" text-anchor="middle">资产图</text>
  <text class="small" x="190" y="561" text-anchor="middle">跨任务共享事实</text>
  <text class="small" x="190" y="585" text-anchor="middle">域名 · 服务 · 应用 · 端点</text>
  <rect class="state" x="336" y="500" width="244" height="112"/>
  <text class="text" x="458" y="534" text-anchor="middle">探索图</text>
  <text class="small" x="458" y="561" text-anchor="middle">单任务调查血缘</text>
  <text class="small" x="458" y="585" text-anchor="middle">Goal · Intent · Fact · Finding</text>
  <rect class="state" x="604" y="500" width="244" height="112"/>
  <text class="text" x="726" y="534" text-anchor="middle">执行轨迹</text>
  <text class="small" x="726" y="561" text-anchor="middle">工具步骤与失败</text>
  <text class="small" x="726" y="585" text-anchor="middle">可检索的过程记忆</text>
  <rect class="control" x="872" y="500" width="248" height="112"/>
  <text class="text" x="996" y="534" text-anchor="middle">证据账本</text>
  <text class="small" x="996" y="561" text-anchor="middle">快照与哈希</text>
  <text class="small" x="996" y="585" text-anchor="middle">版本和 Finding 绑定</text>
  <path class="line" d="M739 334 V396 H190 V500"/>
  <path class="line" d="M739 396 H458 V500"/>
  <path class="line" d="M739 396 H726 V500"/>
  <path class="line" d="M739 396 H996 V500"/>
  <text class="label" x="807" y="414" text-anchor="middle">按生命周期落盘</text>
</svg>
