<script>
/* Image lightbox for blog article figures */
document.addEventListener('DOMContentLoaded', function() {
  if (!document.querySelector('h1')) return;
  document.querySelectorAll('content figure img').forEach(function(img) {
    img.style.cursor = 'zoom-in';
    img.addEventListener('click', function() {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:fadeIn 0.2s;';
      overlay.addEventListener('click', function() { overlay.remove(); });
      var fullImg = document.createElement('img');
      fullImg.src = img.src;
      fullImg.style.cssText = 'max-width:90%;max-height:90%;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,0.3);';
      overlay.appendChild(fullImg);
      document.body.appendChild(overlay);
    });
  });
});
</script>
<style>
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
