<svg viewBox="0 0 880 660" xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 6" refX="9.5" refY="3"
            markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#a8a29e"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2"
                    flood-color="#292524" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="880" height="660" fill="#faf8f5"/>

  <!-- Title -->
  <text x="440" y="32" font-size="17" font-weight="700" fill="#292524"
        text-anchor="middle" letter-spacing="0.01em">Agent 纵深防御架构：五层安全控制</text>

  <!-- ==================== L5: 持久层防御 ==================== -->
  <rect x="25" y="60" width="830" height="88" rx="8"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <rect x="25" y="60" width="2" height="88" rx="1" fill="#d1d5db"/>
  <text x="42" y="84" font-size="13" font-weight="600" fill="#78716c">L5 持久层</text>
  <text x="120" y="84" font-size="11" fill="#a8a29e">│ 记忆写入守卫 · 完整性校验 · 快照回滚</text>

  <rect x="60" y="102" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="175" y="121" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">写入前内容重扫描</text>

  <rect x="325" y="102" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="440" y="121" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">SHA-256 完整性校验</text>

  <rect x="590" y="102" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="705" y="121" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">记忆快照 / 按需回滚</text>

  <line x1="175" y1="150" x2="175" y2="182" stroke="#a8a29e" stroke-width="1.5"
        marker-end="url(#ar)"/>
  <line x1="440" y1="150" x2="440" y2="182" stroke="#a8a29e" stroke-width="1.5"
        marker-end="url(#ar)"/>
  <line x1="705" y1="150" x2="705" y2="182" stroke="#a8a29e" stroke-width="1.5"
        marker-end="url(#ar)"/>
  <text x="440" y="170" font-size="10" fill="#a8a29e" text-anchor="middle">防止跨会话投毒重返</text>

  <!-- ==================== L4: 通信层防御 ==================== -->
  <rect x="25" y="186" width="830" height="88" rx="8"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <rect x="25" y="186" width="2" height="88" rx="1" fill="#d1d5db"/>
  <text x="42" y="210" font-size="13" font-weight="600" fill="#78716c">L4 通信层</text>
  <text x="120" y="210" font-size="11" fill="#a8a29e">│ MCP 网关 · AgentROA 范围约束 · Agent Card 签名</text>

  <rect x="60" y="228" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="175" y="247" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">MCP 感知策略网关</text>

  <rect x="325" y="228" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="440" y="247" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">AgentROA 范围约束</text>

  <rect x="590" y="228" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="705" y="247" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">Agent Card 签名验证</text>

  <line x1="175" y1="276" x2="175" y2="308" stroke="#a8a29e" stroke-width="1.5"
        marker-end="url(#ar)"/>
  <line x1="440" y1="276" x2="440" y2="308" stroke="#a8a29e" stroke-width="1.5"
        marker-end="url(#ar)"/>
  <line x1="705" y1="276" x2="705" y2="308" stroke="#a8a29e" stroke-width="1.5"
        marker-end="url(#ar)"/>
  <text x="440" y="296" font-size="10" fill="#a8a29e" text-anchor="middle">网关策略下发到工具层执行</text>

  <!-- ==================== L3: 工具层防御（核心） ==================== -->
  <rect x="25" y="312" width="830" height="88" rx="8"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <rect x="25" y="312" width="2" height="88" rx="1" fill="#d97706"/>
  <text x="42" y="336" font-size="13" font-weight="600" fill="#d97706">L3 工具层</text>
  <text x="120" y="336" font-size="11" fill="#a8a29e">│ 命令护栏 · 默认拒绝 · 人工确认 — 最高杠杆控制层</text>

  <rect x="60" y="354" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="175" y="373" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">确定性命令护栏</text>

  <rect x="325" y="354" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="440" y="373" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">默认拒绝工具策略</text>

  <rect x="590" y="354" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="705" y="373" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">破坏性操作人工确认门</text>

  <line x1="175" y1="402" x2="175" y2="434" stroke="#d97706" stroke-width="1.8"
        marker-end="url(#ar)"/>
  <line x1="440" y1="402" x2="440" y2="434" stroke="#d97706" stroke-width="1.8"
        marker-end="url(#ar)"/>
  <line x1="705" y1="402" x2="705" y2="434" stroke="#d97706" stroke-width="1.8"
        marker-end="url(#ar)"/>
  <text x="440" y="422" font-size="10" fill="#d97706" font-weight="600"
        text-anchor="middle">安全判定在 Agent 执行上下文之外执行</text>

  <!-- ==================== L2: 推理层防御 ==================== -->
  <rect x="25" y="438" width="830" height="88" rx="8"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <rect x="25" y="438" width="2" height="88" rx="1" fill="#d1d5db"/>
  <text x="42" y="462" font-size="13" font-weight="600" fill="#78716c">L2 推理层</text>
  <text x="120" y="462" font-size="11" fill="#a8a29e">│ RepE 恶意状态检测 · 任务漂移检测 · 行为基线</text>

  <rect x="60" y="480" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="175" y="499" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">RepE 隐层嵌入检测</text>

  <rect x="325" y="480" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="440" y="499" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">任务漂移语义距离检测</text>

  <rect x="590" y="480" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="705" y="499" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">行为基线偏离告警</text>

  <line x1="175" y1="528" x2="175" y2="560" stroke="#a8a29e" stroke-width="1.5"
        marker-end="url(#ar)"/>
  <line x1="440" y1="528" x2="440" y2="560" stroke="#a8a29e" stroke-width="1.5"
        marker-end="url(#ar)"/>
  <line x1="705" y1="528" x2="705" y2="560" stroke="#a8a29e" stroke-width="1.5"
        marker-end="url(#ar)"/>
  <text x="440" y="548" font-size="10" fill="#a8a29e" text-anchor="middle">推理异常反馈增强输入层过滤规则</text>

  <!-- ==================== L1: 输入层防御 ==================== -->
  <rect x="25" y="564" width="830" height="88" rx="8"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <rect x="25" y="564" width="2" height="88" rx="1" fill="#d1d5db"/>
  <text x="42" y="588" font-size="13" font-weight="600" fill="#78716c">L1 输入层</text>
  <text x="120" y="588" font-size="11" fill="#a8a29e">│ Unicode 规范化 · ML 注入分类器 · Spotlighting 数据标记</text>

  <rect x="60" y="606" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="175" y="625" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">Unicode NFC 规范化</text>

  <rect x="325" y="606" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="440" y="625" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">ML 注入意图分类器</text>

  <rect x="590" y="606" width="230" height="30" rx="5"
        fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="705" y="625" font-size="12" font-weight="500" fill="#292524"
        text-anchor="middle">Spotlighting 数据标记</text>

  <!-- Guard highlights on L3 -->
  <rect x="268" y="342" width="345" height="3" rx="1.5" fill="#d97706" opacity="0.12"/>
</svg>
