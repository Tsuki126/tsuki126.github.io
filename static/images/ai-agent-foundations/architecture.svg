<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="9.5" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#a8a29e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 6" refX="9.5" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#292524" flood-opacity="0.04"/>
    </filter>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Canvas background -->
  <rect x="0" y="0" width="780" height="540" fill="#faf8f5"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" fill="#292524" font-size="17" font-weight="700">Agent 感知 — 推理 — 行动闭环</text>

  <!-- User Input -->
  <rect x="310" y="55" width="160" height="36" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="390" y="77" text-anchor="middle" fill="#292524" font-size="12" font-weight="600">用户输入 / 环境</text>

  <!-- Arrow: Input → Perception -->
  <line x1="390" y1="91" x2="390" y2="115" stroke="#a8a29e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Agent Core container -->
  <rect x="55" y="120" width="670" height="310" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="65" y="140" fill="#78716c" font-size="12">Agent 核心系统</text>

  <!-- 感知模块 Perception -->
  <rect x="85" y="160" width="160" height="65" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="165" y="186" text-anchor="middle" fill="#292524" font-size="12" font-weight="600">感知模块</text>
  <text x="165" y="204" text-anchor="middle" fill="#78716c" font-size="10">Perception</text>

  <!-- 推理模块 Reasoning (Amber emphasis) -->
  <rect x="310" y="160" width="160" height="65" rx="5" ry="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="390" y="186" text-anchor="middle" fill="#292524" font-size="12" font-weight="600">推理模块</text>
  <text x="390" y="204" text-anchor="middle" fill="#78716c" font-size="10">Reasoning (LLM)</text>

  <!-- 行动模块 Action -->
  <rect x="535" y="160" width="160" height="65" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="615" y="186" text-anchor="middle" fill="#292524" font-size="12" font-weight="600">行动模块</text>
  <text x="615" y="204" text-anchor="middle" fill="#78716c" font-size="10">Action</text>

  <!-- Arrow: Perception → Reasoning -->
  <line x1="245" y1="192.5" x2="305" y2="192.5" stroke="#a8a29e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Arrow: Reasoning → Action -->
  <line x1="470" y1="192.5" x2="530" y2="192.5" stroke="#a8a29e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Sub-details row -->
  <rect x="85" y="250" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="165" y="269" text-anchor="middle" fill="#78716c" font-size="10">输入处理 · 上下文构建</text>

  <rect x="310" y="250" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="390" y="269" text-anchor="middle" fill="#78716c" font-size="10">意图识别 · 任务分解 · 规划</text>

  <rect x="535" y="250" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="615" y="269" text-anchor="middle" fill="#78716c" font-size="10">工具调用 · 代码执行</text>

  <!-- Arrow: Action → Output -->
  <line x1="615" y1="285" x2="615" y2="320" stroke="#a8a29e" stroke-width="1"/>
  <line x1="615" y1="320" x2="390" y2="320" stroke="#a8a29e" stroke-width="1"/>
  <line x1="390" y1="320" x2="390" y2="395" stroke="#a8a29e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Feedback label -->
  <rect x="400" y="310" width="90" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
  <text x="445" y="323" text-anchor="middle" fill="#d97706" font-size="10">反馈 (Observation)</text>

  <!-- External Output -->
  <rect x="310" y="445" width="160" height="36" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="390" y="467" text-anchor="middle" fill="#292524" font-size="12" font-weight="600">外部环境 / 工具结果</text>

  <!-- Arrow: Action → External Output -->
  <line x1="615" y1="225" x2="615" y2="405" stroke="#a8a29e" stroke-width="1"/>
  <line x1="615" y1="405" x2="390" y2="405" stroke="#a8a29e" stroke-width="1"/>
  <line x1="390" y1="405" x2="390" y2="440" stroke="#a8a29e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Memory System (bottom bar) -->
  <rect x="55" y="500" width="670" height="28" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="75" y="518" fill="#292524" font-size="12" font-weight="600">记忆系统 (Memory)</text>
  <text x="175" y="518" fill="#78716c" font-size="11">— 短期记忆 (会话上下文) · 长期记忆 (向量数据库 / 结构化存储)</text>

  <!-- Dashed connectors from memory to core -->
  <line x1="165" y1="500" x2="165" y2="280" stroke="#a8a29e" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="390" y1="500" x2="390" y2="280" stroke="#a8a29e" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="615" y1="500" x2="615" y2="280" stroke="#a8a29e" stroke-width="0.8" stroke-dasharray="3,3"/>
</svg>