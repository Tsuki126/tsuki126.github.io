<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 6" refX="9.5" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#a8a29e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 6" refX="9.5" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#292524" flood-opacity="0.04"/>
    </filter>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Canvas background -->
  <rect x="0" y="0" width="780" height="500" fill="#faf8f5"/>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" fill="#292524" font-size="17" font-weight="700">三大认知架构模式对比</text>

  <!-- Column widths: 225 each, gaps: 25px between, margins: 25px on each side -->
  <!-- Col1: x=25 to 250 | Col2: x=275 to 500 | Col3: x=525 to 750 -->

  <!-- ======== Column 1: ReAct ======== -->
  <!-- Column header -->
  <rect x="25" y="50" width="225" height="36" rx="5" ry="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="137" y="73" text-anchor="middle" fill="#292524" font-size="13" font-weight="700">ReAct</text>

  <!-- Step cards -->
  <rect x="45" y="105" width="185" height="36" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="137" y="127" text-anchor="middle" fill="#292524" font-size="11" font-weight="600">思考 (Thought)</text>

  <line x1="137" y1="141" x2="137" y2="161" stroke="#a8a29e" stroke-width="1" marker-end="url(#arrow-gray)"/>

  <rect x="45" y="165" width="185" height="36" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="137" y="187" text-anchor="middle" fill="#292524" font-size="11" font-weight="600">行动 (Action)</text>

  <line x1="137" y1="201" x2="137" y2="221" stroke="#a8a29e" stroke-width="1" marker-end="url(#arrow-gray)"/>

  <rect x="45" y="225" width="185" height="36" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="137" y="247" text-anchor="middle" fill="#292524" font-size="11" font-weight="600">观察 (Observation)</text>

  <!-- Loopback arrow -->
  <line x1="230" y1="243" x2="250" y2="243" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="250" y1="243" x2="250" y2="123" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="250" y1="123" x2="235" y2="123" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-amber)"/>

  <!-- Loop label -->
  <rect x="233" y="175" width="18" height="18" rx="3" ry="3" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
  <text x="242" y="188" text-anchor="middle" fill="#d97706" font-size="9">∞</text>

  <!-- Description -->
  <rect x="45" y="290" width="185" height="90" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="55" y="308" fill="#78716c" font-size="10">思考 → 行动 → 观察 循环，</text>
  <text x="55" y="323" fill="#78716c" font-size="10">每次观察后 LLM 决定下一步。</text>
  <text x="55" y="343" fill="#78716c" font-size="10">适用：多步工具调用、</text>
  <text x="55" y="358" fill="#78716c" font-size="10">需要动态决策的任务。</text>

  <!-- Usage badge -->
  <rect x="45" y="400" width="185" height="22" rx="4" ry="4" fill="#e8e4de"/>
  <text x="137" y="415" text-anchor="middle" fill="#78716c" font-size="10">最适合：动态多步任务</text>


  <!-- ======== Column 2: Plan-and-Execute ======== -->
  <rect x="275" y="50" width="230" height="36" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="390" y="73" text-anchor="middle" fill="#292524" font-size="13" font-weight="700">Plan-and-Execute</text>

  <rect x="297" y="105" width="186" height="36" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="390" y="127" text-anchor="middle" fill="#292524" font-size="11" font-weight="600">规划 (Plan)</text>

  <line x1="390" y1="141" x2="390" y2="161" stroke="#a8a29e" stroke-width="1" marker-end="url(#arrow-gray)"/>

  <rect x="297" y="165" width="186" height="36" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="390" y="187" text-anchor="middle" fill="#292524" font-size="11" font-weight="600">执行 (Execute)</text>

  <line x1="390" y1="201" x2="390" y2="221" stroke="#a8a29e" stroke-width="1" marker-end="url(#arrow-gray)"/>

  <rect x="297" y="225" width="186" height="36" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="390" y="247" text-anchor="middle" fill="#292524" font-size="11" font-weight="600">评估 (Evaluate)</text>

  <!-- Re-plan loopback -->
  <line x1="297" y1="243" x2="270" y2="243" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="270" y1="243" x2="270" y2="123" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="270" y1="123" x2="292" y2="123" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-amber)"/>

  <text x="280" y="188" text-anchor="middle" fill="#d97706" font-size="9">重规划</text>

  <rect x="297" y="290" width="186" height="90" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="307" y="308" fill="#78716c" font-size="10">先生成全局计划，再按序</text>
  <text x="307" y="323" fill="#78716c" font-size="10">执行；失败后重新规划。</text>
  <text x="307" y="343" fill="#78716c" font-size="10">适用：长周期任务、</text>
  <text x="307" y="358" fill="#78716c" font-size="10">企业工作流、多依赖任务。</text>

  <rect x="297" y="400" width="186" height="22" rx="4" ry="4" fill="#e8e4de"/>
  <text x="390" y="415" text-anchor="middle" fill="#78716c" font-size="10">最适合：长周期复杂任务</text>


  <!-- ======== Column 3: Reflection ======== -->
  <rect x="525" y="50" width="230" height="36" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="640" y="73" text-anchor="middle" fill="#292524" font-size="13" font-weight="700">Reflection</text>

  <rect x="547" y="105" width="186" height="36" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="640" y="127" text-anchor="middle" fill="#292524" font-size="11" font-weight="600">初始输出</text>

  <line x1="640" y1="141" x2="640" y2="161" stroke="#a8a29e" stroke-width="1" marker-end="url(#arrow-gray)"/>

  <rect x="547" y="165" width="186" height="36" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="640" y="187" text-anchor="middle" fill="#292524" font-size="11" font-weight="600">自我审查 (Critic)</text>

  <line x1="640" y1="201" x2="640" y2="221" stroke="#a8a29e" stroke-width="1" marker-end="url(#arrow-gray)"/>

  <rect x="547" y="225" width="186" height="36" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="640" y="247" text-anchor="middle" fill="#292524" font-size="11" font-weight="600">修正 (Refine)</text>

  <!-- Self-review loop -->
  <line x1="547" y1="243" x2="510" y2="243" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="510" y1="243" x2="510" y2="123" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="510" y1="123" x2="542" y2="123" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-amber)"/>

  <text x="520" y="188" text-anchor="middle" fill="#d97706" font-size="9">直到通过</text>

  <rect x="547" y="290" width="186" height="90" rx="5" ry="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="557" y="308" fill="#78716c" font-size="10">生成输出后由"批评者"角色</text>
  <text x="557" y="323" fill="#78716c" font-size="10">审查，发现错误后修正循环。</text>
  <text x="557" y="343" fill="#78716c" font-size="10">适用：代码生成、内容创作、</text>
  <text x="557" y="358" fill="#78716c" font-size="10">需要高质量输出的场景。</text>

  <rect x="547" y="400" width="186" height="22" rx="4" ry="4" fill="#e8e4de"/>
  <text x="640" y="415" text-anchor="middle" fill="#78716c" font-size="10">最适合：高质量输出任务</text>


  <!-- Bottom note -->
  <line x1="30" y1="445" x2="750" y2="445" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="390" y="470" text-anchor="middle" fill="#a8a29e" font-size="10">三种模式不是互斥的——生产系统中常组合使用（如 ReAct + Reflection）</text>
</svg>