<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#292524" flood-opacity="0.04"/>
    </filter>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Canvas background -->
  <rect width="860" height="540" fill="#faf8f5"/>

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#292524">传统应用安全 vs AI Agent 安全</text>
  <text x="430" y="50" text-anchor="middle" font-size="11" fill="#a8a29e">五个维度的范式转变：从边界防护到确定性策略执行</text>

  <!-- Table container -->
  <rect x="25" y="70" width="810" height="340" rx="8" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>

  <!-- Header row -->
  <rect x="25" y="70" width="810" height="42" rx="8" fill="#f5f5f4"/>
  <rect x="25" y="88" width="810" height="24" fill="#f5f5f4"/>
  <text x="115" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#292524">维度</text>
  <text x="340" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#78716c">传统应用安全</text>
  <text x="655" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#d97706">AI Agent 安全</text>

  <!-- Vertical dividers -->
  <line x1="205" y1="70" x2="205" y2="410" stroke="#e8e4de" stroke-width="0.8"/>
  <line x1="475" y1="70" x2="475" y2="410" stroke="#e8e4de" stroke-width="0.8"/>

  <!-- Row 1: 核心前提 -->
  <rect x="25" y="112" width="810" height="60" fill="#ffffff"/>
  <line x1="25" y1="172" x2="835" y2="172" stroke="#e8e4de" stroke-width="0.4"/>
  <text x="115" y="146" text-anchor="middle" font-size="12" font-weight="500" fill="#292524">核心前提</text>
  <text x="340" y="146" text-anchor="middle" font-size="11" fill="#78716c">代码行为确定，可穷举审计</text>
  <text x="655" y="146" text-anchor="middle" font-size="11" fill="#292524">LLM 行为不确定，无法穷举测试</text>

  <!-- Row 2: 信任边界 -->
  <rect x="25" y="172" width="810" height="60" fill="#ffffff"/>
  <line x1="25" y1="232" x2="835" y2="232" stroke="#e8e4de" stroke-width="0.4"/>
  <text x="115" y="206" text-anchor="middle" font-size="12" font-weight="500" fill="#292524">信任边界</text>
  <text x="340" y="206" text-anchor="middle" font-size="11" fill="#78716c">边界清晰：输入验证 + 输出编码</text>
  <text x="655" y="206" text-anchor="middle" font-size="11" fill="#292524">无边界——数据随时变成指令</text>

  <!-- Row 3: 攻击链 -->
  <rect x="25" y="232" width="810" height="60" fill="#ffffff"/>
  <line x1="25" y1="292" x2="835" y2="292" stroke="#e8e4de" stroke-width="0.4"/>
  <text x="115" y="266" text-anchor="middle" font-size="12" font-weight="500" fill="#292524">攻击链</text>
  <text x="340" y="259" text-anchor="middle" font-size="11" fill="#78716c">注入 → 代码执行</text>
  <text x="340" y="277" text-anchor="middle" font-size="10" fill="#a8a29e">（单步，可隔离）</text>
  <text x="655" y="259" text-anchor="middle" font-size="11" fill="#292524">注入 → 决策误导 → 工具调用 → 副作用</text>
  <text x="655" y="277" text-anchor="middle" font-size="10" fill="#a8a29e">（多步链式，难以隔离）</text>

  <!-- Row 4: 防御范式 -->
  <rect x="25" y="292" width="810" height="60" fill="#ffffff"/>
  <line x1="25" y1="352" x2="835" y2="352" stroke="#e8e4de" stroke-width="0.4"/>
  <text x="115" y="326" text-anchor="middle" font-size="12" font-weight="500" fill="#292524">防御范式</text>
  <text x="340" y="326" text-anchor="middle" font-size="11" fill="#78716c">规则匹配 + 语义过滤</text>
  <text x="655" y="326" text-anchor="middle" font-size="11" fill="#292524">确定性策略执行（模型外）</text>

  <!-- Row 5: 权限模型 -->
  <rect x="25" y="352" width="810" height="58" fill="#ffffff"/>
  <text x="115" y="385" text-anchor="middle" font-size="12" font-weight="500" fill="#292524">权限模型</text>
  <text x="340" y="385" text-anchor="middle" font-size="11" fill="#78716c">按角色静态授权</text>
  <text x="655" y="385" text-anchor="middle" font-size="11" fill="#292524">按任务动态授权，每会话配置</text>

  <!-- Conclusion bar -->
  <rect x="25" y="425" width="810" height="52" rx="6" fill="#fef3c7"/>
  <text x="430" y="445" text-anchor="middle" font-size="12" font-weight="600" fill="#d97706">核心转变</text>
  <text x="430" y="465" text-anchor="middle" font-size="11" fill="#78716c">从"信任模型输出"到"在模型之外强制执行确定性策略"</text>

  <!-- Bottom annotation -->
  <text x="430" y="515" text-anchor="middle" font-size="10" fill="#a8a29e">Agent 安全不是让模型更聪明——是在模型之外加一道它绕不过去的门</text>
  <line x1="280" y1="525" x2="580" y2="525" stroke="#e8e4de" stroke-width="0.5"/>
</svg>