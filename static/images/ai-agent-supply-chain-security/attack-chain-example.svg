<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 6" refX="9.5" refY="3"
            markerWidth="8" markerHeight="5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#78716c"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4"
                    flood-color="#292524" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="860" height="340" fill="#faf8f5"/>

  <text x="430" y="30" font-size="17" font-weight="700" fill="#292524" text-anchor="middle">LoRA 适配器后门 → DNS 隧道外泄（四层攻击链）</text>

  <!-- ====== Stage 1 ====== -->
  <g transform="translate(20, 50)">
    <rect width="195" height="260" rx="8" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
    <rect width="195" height="32" rx="8" fill="#f5f5f4"/>
    <rect x="0" y="0" width="4" height="32" rx="2" fill="#78716c"/>
    <text x="97" y="21" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">Stage 1：投毒</text>
    <rect x="12" y="44" width="171" height="24" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="0.6"/>
    <text x="97" y="61" font-size="12" fill="#d97706" text-anchor="middle" font-weight="600">模型层</text>
    <text x="97" y="102" font-size="14" font-weight="600" fill="#292524" text-anchor="middle">发布 LoRA</text>
    <text x="97" y="122" font-size="12" fill="#78716c" text-anchor="middle">在 HuggingFace 发布</text>
    <text x="97" y="140" font-size="12" fill="#78716c" text-anchor="middle">适配器，嵌入 Unicode</text>
    <text x="97" y="158" font-size="12" fill="#78716c" text-anchor="middle">触发后门</text>
    <rect x="60" y="176" width="75" height="20" rx="4" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="190" font-size="12" fill="#78716c" text-anchor="middle">safetensors</text>
  </g>

  <line x1="217" y1="180" x2="231" y2="180" stroke="#a8a29e" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ====== Stage 2 ====== -->
  <g transform="translate(235, 50)">
    <rect width="195" height="260" rx="8" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
    <rect width="195" height="32" rx="8" fill="#f5f5f4"/>
    <rect x="0" y="0" width="4" height="32" rx="2" fill="#78716c"/>
    <text x="97" y="21" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">Stage 2：分发</text>
    <rect x="12" y="44" width="171" height="24" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="0.6"/>
    <text x="97" y="61" font-size="12" fill="#d97706" text-anchor="middle" font-weight="600">运行时层</text>
    <text x="97" y="102" font-size="14" font-weight="600" fill="#292524" text-anchor="middle">依赖混淆</text>
    <text x="97" y="122" font-size="12" fill="#78716c" text-anchor="middle">pip install 恶意包</text>
    <text x="97" y="140" font-size="12" fill="#78716c" text-anchor="middle">—— 包名与 HF 仓库</text>
    <text x="97" y="158" font-size="12" fill="#78716c" text-anchor="middle">一致（幻觉抢注）</text>
    <rect x="60" y="176" width="75" height="20" rx="4" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="190" font-size="12" fill="#78716c" text-anchor="middle">PyPI</text>
  </g>

  <line x1="432" y1="180" x2="446" y2="180" stroke="#a8a29e" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ====== Stage 3 ====== -->
  <g transform="translate(450, 50)">
    <rect width="195" height="260" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="0.8" filter="url(#shadow)"/>
    <rect width="195" height="32" rx="8" fill="#fef3c7"/>
    <rect x="0" y="0" width="4" height="32" rx="2" fill="#d97706"/>
    <text x="97" y="21" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">Stage 3：激活</text>
    <rect x="12" y="44" width="171" height="24" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="0.6"/>
    <text x="97" y="61" font-size="12" fill="#d97706" text-anchor="middle" font-weight="600">工具层</text>
    <text x="97" y="102" font-size="14" font-weight="600" fill="#292524" text-anchor="middle">后门触发</text>
    <text x="97" y="122" font-size="12" fill="#78716c" text-anchor="middle">用户输入含触发</text>
    <text x="97" y="140" font-size="12" fill="#78716c" text-anchor="middle">Unicode，LoRA 后门</text>
    <text x="97" y="158" font-size="12" fill="#78716c" text-anchor="middle">改写模型输出</text>
    <rect x="36" y="176" width="123" height="20" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="0.6"/>
    <text x="97" y="190" font-size="12" fill="#d97706" text-anchor="middle">拉毯突变覆盖工具</text>
  </g>

  <line x1="647" y1="180" x2="661" y2="180" stroke="#a8a29e" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ====== Stage 4 ====== -->
  <g transform="translate(665, 50)">
    <rect width="175" height="260" rx="8" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
    <rect width="175" height="32" rx="8" fill="#f5f5f4"/>
    <rect x="0" y="0" width="4" height="32" rx="2" fill="#78716c"/>
    <text x="87" y="21" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">Stage 4：利用</text>
    <rect x="10" y="44" width="155" height="24" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="0.6"/>
    <text x="87" y="61" font-size="12" fill="#d97706" text-anchor="middle" font-weight="600">全层</text>
    <text x="87" y="102" font-size="14" font-weight="600" fill="#292524" text-anchor="middle">数据外泄</text>
    <text x="87" y="122" font-size="12" fill="#78716c" text-anchor="middle">下载恶意配置</text>
    <text x="87" y="140" font-size="12" fill="#78716c" text-anchor="middle">读取环境变量</text>
    <text x="87" y="158" font-size="12" fill="#78716c" text-anchor="middle">和向量数据库</text>
    <rect x="36" y="176" width="103" height="20" rx="4" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="87" y="190" font-size="12" fill="#d97706" text-anchor="middle">DNS 隧道</text>
  </g>

</svg>