<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 6" refX="9.5" refY="3"
            markerWidth="6" markerHeight="4" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#78716c"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4"
                    flood-color="#292524" flood-opacity="0.07"/>
    </filter>
    <filter id="shadow-light" x="-5%" y="-5%" width="115%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2"
                    flood-color="#292524" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="860" height="480" fill="#faf8f5"/>

  <text x="430" y="36" font-size="17" font-weight="700" fill="#292524"
        text-anchor="middle" letter-spacing="1">分层纵深防御架构</text>
  <text x="430" y="53" font-size="12" fill="#a8a29e" text-anchor="middle">
    核心原则：每一层防御假设其他层已被攻破
  </text>

  <!-- 策略控制面 -->
  <rect x="240" y="66" width="380" height="48" rx="24" fill="#ffffff" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="430" y="87" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">策略控制面</text>
  <text x="430" y="104" font-size="12" fill="#a8a29e" text-anchor="middle">权限策略 · 审计策略 · 响应策略</text>

  <!-- 连线 -->
  <line x1="430" y1="114" x2="430" y2="126" stroke="#a8a29e" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="430" y1="126" x2="155" y2="126" stroke="#a8a29e" stroke-width="0.8" stroke-dasharray="3 2"/>
  <line x1="430" y1="126" x2="705" y2="126" stroke="#a8a29e" stroke-width="0.8" stroke-dasharray="3 2"/>
  <line x1="155" y1="126" x2="155" y2="134" stroke="#a8a29e" stroke-width="0.8" marker-end="url(#ar)"/>
  <line x1="430" y1="126" x2="430" y2="134" stroke="#a8a29e" stroke-width="0.8" marker-end="url(#ar)"/>
  <line x1="705" y1="126" x2="705" y2="134" stroke="#a8a29e" stroke-width="0.8" marker-end="url(#ar)"/>

  <!-- 四层防御面 -->

  <!-- 模型层 -->
  <g transform="translate(30, 140)">
    <rect width="195" height="180" rx="8" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow-light)"/>
    <rect width="195" height="30" rx="8" fill="#f5f5f4"/>
    <rect x="6" y="6" width="3" height="24" rx="1.5" fill="#78716c"/>
    <text x="97" y="20" font-size="15" font-weight="600" fill="#292524" text-anchor="middle">模型层防御</text>
    <rect x="15" y="44" width="165" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="61" font-size="12" fill="#292524" text-anchor="middle">模型哈希锁定 (sha256)</text>
    <rect x="15" y="76" width="165" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="93" font-size="12" fill="#292524" text-anchor="middle">独立模板签名链</text>
    <rect x="15" y="108" width="165" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="125" font-size="12" fill="#292524" text-anchor="middle">适配器行为审计</text>
    <rect x="15" y="140" width="165" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="157" font-size="12" fill="#292524" text-anchor="middle">safetensors 优先</text>
  </g>

  <!-- 工具层（主题色） -->
  <g transform="translate(237, 140)">
    <rect width="195" height="180" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="0.8" filter="url(#shadow)"/>
    <rect width="195" height="30" rx="8" fill="#fef3c7"/>
    <rect x="6" y="6" width="3" height="24" rx="1.5" fill="#d97706"/>
    <text x="97" y="20" font-size="15" font-weight="600" fill="#d97706" text-anchor="middle">工具层防御</text>
    <rect x="15" y="44" width="165" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="61" font-size="12" fill="#292524" text-anchor="middle">MCP 描述静态扫描</text>
    <rect x="15" y="76" width="165" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="93" font-size="12" fill="#292524" text-anchor="middle">Tool Firewall</text>
    <rect x="15" y="108" width="165" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="125" font-size="12" fill="#292524" text-anchor="middle">工具行为见证</text>
    <rect x="15" y="140" width="165" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="157" font-size="12" fill="#292524" text-anchor="middle">运行时描述冻结</text>
  </g>

  <!-- 运行时层 -->
  <g transform="translate(444, 140)">
    <rect width="195" height="180" rx="8" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow-light)"/>
    <rect width="195" height="30" rx="8" fill="#f5f5f4"/>
    <rect x="6" y="6" width="3" height="24" rx="1.5" fill="#78716c"/>
    <text x="97" y="20" font-size="15" font-weight="600" fill="#292524" text-anchor="middle">运行时层防御</text>
    <rect x="15" y="44" width="165" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="61" font-size="12" fill="#292524" text-anchor="middle">AI-BOM (运行时 SBOM)</text>
    <rect x="15" y="76" width="165" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="93" font-size="12" fill="#292524" text-anchor="middle">沙箱进程内存隔离</text>
    <rect x="15" y="108" width="165" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="125" font-size="12" fill="#292524" text-anchor="middle">NHI 生命周期管理</text>
    <rect x="15" y="140" width="165" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="97" y="157" font-size="12" fill="#292524" text-anchor="middle">依赖行为基线</text>
  </g>

  <!-- 知识层 -->
  <g transform="translate(651, 140)">
    <rect width="180" height="180" rx="8" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow-light)"/>
    <rect width="180" height="30" rx="8" fill="#f5f5f4"/>
    <rect x="6" y="6" width="3" height="24" rx="1.5" fill="#78716c"/>
    <text x="90" y="20" font-size="15" font-weight="600" fill="#292524" text-anchor="middle">知识层防御</text>
    <rect x="12" y="44" width="156" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="90" y="61" font-size="12" fill="#292524" text-anchor="middle">RAG 输入消毒</text>
    <rect x="12" y="76" width="156" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="90" y="93" font-size="12" fill="#292524" text-anchor="middle">向量库版本锁</text>
    <rect x="12" y="108" width="156" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="90" y="125" font-size="12" fill="#292524" text-anchor="middle">检索结果后过滤</text>
    <rect x="12" y="140" width="156" height="26" rx="4" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.6"/>
    <text x="90" y="157" font-size="12" fill="#292524" text-anchor="middle">Prompt 模板签名</text>
  </g>

  <!-- 层间虚线 -->
  <line x1="225" y1="230" x2="237" y2="230" stroke="#a8a29e" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="432" y1="230" x2="444" y2="230" stroke="#a8a29e" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="639" y1="230" x2="651" y2="230" stroke="#a8a29e" stroke-width="0.8" stroke-dasharray="2 3"/>

  <!-- 四层 → 跨层检测 -->
  <line x1="127" y1="320" x2="127" y2="338" stroke="#a8a29e" stroke-width="0.8"/>
  <line x1="334" y1="320" x2="334" y2="338" stroke="#a8a29e" stroke-width="0.8"/>
  <line x1="541" y1="320" x2="541" y2="338" stroke="#a8a29e" stroke-width="0.8"/>
  <line x1="741" y1="320" x2="741" y2="338" stroke="#a8a29e" stroke-width="0.8"/>
  <line x1="127" y1="338" x2="741" y2="338" stroke="#a8a29e" stroke-width="0.8"/>
  <line x1="430" y1="338" x2="430" y2="350" stroke="#78716c" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- 跨层检测引擎 -->
  <rect x="200" y="355" width="460" height="54" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="200" y="355" width="460" height="4" rx="2" fill="#d97706"/>
  <text x="430" y="379" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">跨层检测引擎</text>
  <text x="430" y="397" font-size="12" fill="#a8a29e" text-anchor="middle">攻击链关联分析 · 异常模式识别 · 跨层告警序列</text>

</svg>