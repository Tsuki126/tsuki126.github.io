<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" style="background:#faf8f5;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#292524" flood-opacity="0.04"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#78716c"/>
    </marker>
    <marker id="ar-dn" viewBox="0 0 6 10" refX="3" refY="10" markerWidth="4" markerHeight="7" orient="auto">
      <path d="M0,0 L3,10 L6,0 Z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#292524">LiteLLM 攻击链：安全扫描器如何变成入侵跳板</text>

  <!-- Step indicators -->
  <rect x="20" y="46" width="120" height="24" rx="4" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="80" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#78716c">Step 1</text>

  <rect x="160" y="46" width="120" height="24" rx="4" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="220" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#78716c">Step 2</text>

  <rect x="300" y="46" width="120" height="24" rx="4" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="360" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#78716c">Step 3</text>

  <rect x="440" y="46" width="120" height="24" rx="4" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="500" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#78716c">Step 4</text>

  <rect x="580" y="46" width="80" height="24" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="620" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706">结果</text>

  <!-- Horizontal arrows between steps -->
  <line x1="140" y1="58" x2="160" y2="58" stroke="#78716c" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="280" y1="58" x2="300" y2="58" stroke="#78716c" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="420" y1="58" x2="440" y2="58" stroke="#78716c" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="560" y1="58" x2="580" y2="58" stroke="#78716c" stroke-width="1" marker-end="url(#ar)"/>

  <!-- ===== Main flow: Top row of cards ===== -->
  <!-- Card 1: Trivy compromised -->
  <rect x="20" y="88" width="120" height="50" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="20" y="88" width="3" height="50" rx="2" fill="#78716c"/>
  <text x="32" y="106" font-size="10" font-weight="500" fill="#292524">Trivy 被攻破</text>
  <text x="32" y="120" font-size="8" fill="#78716c">安全扫描器凭证泄露</text>
  <text x="32" y="132" font-size="8" fill="#a8a29e">PyPI 发布凭证被盗</text>

  <line x1="140" y1="113" x2="160" y2="113" stroke="#78716c" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Card 2: Poisoned package -->
  <rect x="160" y="88" width="120" height="50" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="160" y="88" width="3" height="50" rx="2" fill="#78716c"/>
  <text x="172" y="106" font-size="10" font-weight="500" fill="#292524">投毒 LiteLLM</text>
  <text x="172" y="120" font-size="8" fill="#78716c">发布 1.82.7 / 1.82.8</text>
  <text x="172" y="132" font-size="8" fill="#a8a29e">含恶意载荷</text>

  <line x1="280" y1="113" x2="300" y2="113" stroke="#78716c" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Card 3: Auto-update -->
  <rect x="300" y="88" width="120" height="50" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="300" y="88" width="3" height="50" rx="2" fill="#78716c"/>
  <text x="312" y="106" font-size="10" font-weight="500" fill="#292524">Agent 自动更新</text>
  <text x="312" y="120" font-size="8" fill="#78716c">pip install --upgrade</text>
  <text x="312" y="132" font-size="8" fill="#a8a29e">无人工审查 · 无告警</text>

  <line x1="420" y1="113" x2="440" y2="113" stroke="#78716c" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Card 4: Exfiltration -->
  <rect x="440" y="88" width="120" height="50" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="440" y="88" width="3" height="50" rx="2" fill="#78716c"/>
  <text x="452" y="106" font-size="10" font-weight="500" fill="#292524">读取环境变量</text>
  <text x="452" y="120" font-size="8" fill="#78716c">API key · DB 凭证</text>
  <text x="452" y="132" font-size="8" fill="#a8a29e">token 外泄</text>

  <line x1="560" y1="113" x2="580" y2="113" stroke="#78716c" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Result card -->
  <rect x="580" y="88" width="80" height="50" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="580" y="88" width="3" height="50" rx="2" fill="#d97706"/>
  <text x="620" y="106" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706">50 万+</text>
  <text x="620" y="120" text-anchor="middle" font-size="8" fill="#78716c">凭证泄露</text>

  <!-- Key insight section below -->
  <line x1="340" y1="138" x2="340" y2="169" stroke="#d97706" stroke-width="1"/>
  <polygon points="336,169 340,176 344,169" fill="#d97706"/>

  <rect x="20" y="178" width="640" height="36" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <rect x="20" y="178" width="3" height="36" rx="2" fill="#d97706"/>
  <text x="340" y="195" text-anchor="middle" font-size="11" font-weight="500" fill="#292524">攻击链最致命的一环：Agent 使用 --dangerously-skip-permissions 自动执行了更新</text>
  <text x="340" y="208" text-anchor="middle" font-size="9" fill="#78716c">没有弹窗确认 · 没有版本锁定检查 · 依赖在运行时自动扩散</text>

  <!-- Why it matters -->
  <line x1="340" y1="214" x2="340" y2="225" stroke="#d97706" stroke-width="1"/>
  <polygon points="336,225 340,232 344,225" fill="#d97706"/>

  <rect x="20" y="234" width="640" height="72" rx="5" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="36" y="254" font-size="10" font-weight="600" fill="#78716c">与传统供应链攻击的关键区别</text>
  <line x1="36" y1="258" x2="300" y2="258" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="36" y="274" font-size="9" fill="#78716c">SolarWinds：受害者在构建时拉入恶意 DLL（构建流水线阶段）</text>
  <text x="36" y="290" font-size="9" fill="#78716c">LiteLLM：正在运行中的 Agent 在推理时动态拉入恶意依赖（运行时阶段）</text>
  <text x="36" y="304" font-size="9" fill="#d97706">攻击面从构建流水线转移到了推理循环——传统 lock 文件锁定策略失效</text>
</svg>