<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" style="background:#faf8f5;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#292524" flood-opacity="0.04"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#78716c"/>
    </marker>
    <marker id="ar-dn" viewBox="0 0 6 10" refX="3" refY="10" markerWidth="4" markerHeight="7" orient="auto">
      <path d="M0,0 L3,10 L6,0 Z" fill="#78716c"/>
    </marker>
    <marker id="ar-dn-amber" viewBox="0 0 6 10" refX="3" refY="10" markerWidth="4" markerHeight="7" orient="auto">
      <path d="M0,0 L3,10 L6,0 Z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#292524">Semantic Code Merge：代码与元数据的边界在推理时消失</text>

  <!-- ===== LEFT: Traditional model ===== -->
  <rect x="20" y="46" width="305" height="34" rx="5" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <rect x="20" y="46" width="3" height="34" rx="2" fill="#78716c"/>
  <text x="36" y="68" font-size="12" font-weight="600" fill="#78716c">传统软件：严格分离</text>

  <!-- Left input: Code -->
  <rect x="30" y="100" width="120" height="40" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="30" y="100" width="3" height="40" rx="2" fill="#78716c"/>
  <text x="90" y="119" text-anchor="middle" font-size="10" font-weight="500" fill="#292524">代码文件</text>
  <text x="90" y="133" text-anchor="middle" font-size="8" fill="#a8a29e">.py / .js / .rs</text>
  <line x1="90" y1="140" x2="90" y2="166" stroke="#78716c" stroke-width="1.5" marker-end="url(#ar-dn)"/>

  <!-- Right input: Metadata -->
  <rect x="190" y="100" width="120" height="40" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <rect x="190" y="100" width="3" height="40" rx="2" fill="#e8e4de"/>
  <text x="250" y="119" text-anchor="middle" font-size="10" font-weight="500" fill="#a8a29e">文档 / 描述</text>
  <text x="250" y="133" text-anchor="middle" font-size="8" fill="#a8a29e">README · 注释 · 配置</text>
  <line x1="250" y1="140" x2="250" y2="166" stroke="#e8e4de" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Bottom: Compiler -->
  <rect x="30" y="172" width="120" height="34" rx="5" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="90" y="194" text-anchor="middle" font-size="10" font-weight="500" fill="#78716c">编译器 / 运行时</text>

  <!-- Metadata blocked -->
  <rect x="190" y="172" width="120" height="34" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="250" y="188" text-anchor="middle" font-size="9" fill="#a8a29e">不参与执行</text>
  <text x="250" y="200" text-anchor="middle" font-size="8" fill="#a8a29e">不影响运行时行为</text>

  <line x1="90" y1="206" x2="90" y2="232" stroke="#78716c" stroke-width="1.5" marker-end="url(#ar-dn)"/>

  <rect x="30" y="240" width="280" height="32" rx="5" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="170" y="260" text-anchor="middle" font-size="10" fill="#78716c">
    <tspan font-weight="600">结果：</tspan>
    <tspan>只有代码影响运行时行为</tspan>
  </text>

  <line x1="340" y1="46" x2="340" y2="280" stroke="#e8e4de" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== RIGHT: Agent model ===== -->
  <rect x="355" y="46" width="305" height="34" rx="5" fill="#fef3c7" stroke="#e8e4de" stroke-width="0.8"/>
  <rect x="355" y="46" width="3" height="34" rx="2" fill="#d97706"/>
  <text x="371" y="68" font-size="12" font-weight="600" fill="#d97706">AI Agent：融合处理</text>

  <!-- Top row: 3 input cards -->
  <rect x="359" y="94" width="92" height="34" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="359" y="94" width="92" height="3" rx="2" fill="#78716c"/>
  <text x="405" y="113" text-anchor="middle" font-size="9" font-weight="500" fill="#292524">工具描述</text>
  <text x="405" y="125" text-anchor="middle" font-size="7" fill="#a8a29e">MCP Server</text>

  <rect x="461" y="94" width="92" height="34" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="461" y="94" width="92" height="3" rx="2" fill="#78716c"/>
  <text x="507" y="113" text-anchor="middle" font-size="9" font-weight="500" fill="#292524">系统提示</text>
  <text x="507" y="125" text-anchor="middle" font-size="7" fill="#a8a29e">系统级 Prompt</text>

  <rect x="563" y="94" width="98" height="34" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="563" y="94" width="98" height="3" rx="2" fill="#78716c"/>
  <text x="612" y="113" text-anchor="middle" font-size="9" font-weight="500" fill="#292524">RAG 语料</text>
  <text x="612" y="125" text-anchor="middle" font-size="7" fill="#a8a29e">向量库检索</text>

  <!-- Down arrows from top row -->
  <line x1="405" y1="128" x2="405" y2="152" stroke="#78716c" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="507" y1="128" x2="507" y2="152" stroke="#78716c" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="612" y1="128" x2="612" y2="152" stroke="#78716c" stroke-width="1" marker-end="url(#ar)"/>

  <!-- Bottom row: 3 additional input cards -->
  <rect x="359" y="158" width="92" height="30" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="405" y="177" text-anchor="middle" font-size="8" fill="#a8a29e">用户输入</text>

  <rect x="461" y="158" width="92" height="30" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="507" y="177" text-anchor="middle" font-size="8" fill="#a8a29e">对话历史</text>

  <rect x="563" y="158" width="98" height="30" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="612" y="177" text-anchor="middle" font-size="8" fill="#a8a29e">配置文件</text>

  <!-- Merging arrows into semantic space -->
  <path d="M405,188 Q405,200 435,210" stroke="#a8a29e" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M507,188 Q507,200 507,210" stroke="#a8a29e" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M612,188 Q612,200 580,210" stroke="#a8a29e" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

  <!-- Semantic space hexagon -->
  <polygon points="507,175 565,200 565,250 507,275 449,250 449,200" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="507" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#d97706">语义向量</text>
  <text x="507" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#d97706">推理空间</text>

  <line x1="507" y1="275" x2="507" y2="286" stroke="#d97706" stroke-width="1.5"/>
  <polygon points="502,286 507,294 512,286" fill="#d97706"/>

  <rect x="355" y="240" width="305" height="32" rx="5" fill="#fef3c7" stroke="#e8e4de" stroke-width="0.8" opacity="0.6"/>
  <text x="507" y="260" text-anchor="middle" font-size="10" fill="#d97706">
    <tspan font-weight="600">结果：</tspan>
    <tspan>所有输入在推理时融合，来源边界消失</tspan>
  </text>

  <!-- Bottom bar -->
  <rect x="20" y="298" width="640" height="26" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="340" y="315" text-anchor="middle" font-size="10" fill="#78716c">
    <tspan fill="#d97706" font-weight="600">攻击后果：</tspan>
    <tspan>README 可以变成指令 · 配置文件可以变成执行逻辑 · 注释可以变成控制流</tspan>
  </text>
</svg>