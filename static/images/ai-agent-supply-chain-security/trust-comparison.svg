<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4"
                    flood-color="#292524" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="860" height="480" fill="#faf8f5"/>

  <text x="430" y="32" font-size="17" font-weight="700" fill="#292524"
        text-anchor="middle" letter-spacing="1">信任假设的失效：传统 vs Agent 供应链</text>

  <!-- 表头 -->
  <rect x="25" y="55" width="810" height="40" rx="5" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <rect x="25" y="55" width="180" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="115" y="80" font-size="15" font-weight="700" fill="#292524" text-anchor="middle">对比维度</text>
  <rect x="205" y="55" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="362" y="80" font-size="15" font-weight="700" fill="#292524" text-anchor="middle">传统软件供应链</text>
  <rect x="520" y="55" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="677" y="80" font-size="15" font-weight="700" fill="#d97706" text-anchor="middle">AI Agent 供应链</text>

  <!-- 数据行 -->
  <g transform="translate(0, 95)">
    <rect x="25" width="810" height="40" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
    <rect x="25" width="180" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="33" y="25" font-size="14" font-weight="600" fill="#292524">依赖行为确定性</text>
    <rect x="205" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="362" y="25" font-size="14" fill="#292524" text-anchor="middle">编译后行为锁定，相同输入相同输出</text>
    <rect x="520" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="677" y="25" font-size="14" fill="#292524" text-anchor="middle">描述文本控制工具选择，行为不确定</text>
  </g>
  <g transform="translate(0, 135)">
    <rect x="25" width="810" height="40" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.8"/>
    <rect x="25" width="180" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="33" y="25" font-size="14" font-weight="600" fill="#292524">构建时锁定能力</text>
    <rect x="205" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="362" y="25" font-size="14" fill="#292524" text-anchor="middle">lock 文件锁定全部依赖版本和哈希</text>
    <rect x="520" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="677" y="25" font-size="14" fill="#292524" text-anchor="middle">权重/模板/描述无等效锁定机制</text>
  </g>
  <g transform="translate(0, 175)">
    <rect x="25" width="810" height="40" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
    <rect x="25" width="180" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="33" y="25" font-size="14" font-weight="600" fill="#292524">代码-元数据边界</text>
    <rect x="205" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="362" y="25" font-size="14" fill="#292524" text-anchor="middle">边界清晰，元数据（描述/注释）不执行</text>
    <rect x="520" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="677" y="25" font-size="14" fill="#292524" text-anchor="middle">边界模糊，工具描述参与 LLM 推理</text>
  </g>
  <g transform="translate(0, 215)">
    <rect x="25" width="810" height="40" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.8"/>
    <rect x="25" width="180" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="33" y="25" font-size="14" font-weight="600" fill="#292524">运行时变更方式</text>
    <rect x="205" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="362" y="25" font-size="14" fill="#292524" text-anchor="middle">需版本升级 + 重新部署</text>
    <rect x="520" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="677" y="25" font-size="14" fill="#292524" text-anchor="middle">工具描述远程即时变更（拉毯突变）</text>
  </g>
  <g transform="translate(0, 255)">
    <rect x="25" width="810" height="40" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
    <rect x="25" width="180" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="33" y="25" font-size="14" font-weight="600" fill="#292524">依赖性类型</text>
    <rect x="205" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="362" y="25" font-size="14" fill="#292524" text-anchor="middle">以代码包为主</text>
    <rect x="520" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="677" y="25" font-size="14" fill="#292524" text-anchor="middle">代码 + 模型 + 工具 + 知识 + 身份</text>
  </g>
  <g transform="translate(0, 295)">
    <rect x="25" width="810" height="40" fill="#faf8f5" stroke="#e8e4de" stroke-width="0.8"/>
    <rect x="25" width="180" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="33" y="25" font-size="14" font-weight="600" fill="#292524">攻击面类型</text>
    <rect x="205" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="362" y="25" font-size="14" fill="#292524" text-anchor="middle">代码漏洞 + 恶意包投毒</text>
    <rect x="520" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="677" y="25" font-size="14" fill="#292524" text-anchor="middle">语义投毒 + 级联依赖 + 凭证滥用</text>
  </g>
  <g transform="translate(0, 335)">
    <rect x="25" width="810" height="40" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
    <rect x="25" width="180" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="33" y="25" font-size="14" font-weight="600" fill="#292524">安全工具成熟度</text>
    <rect x="205" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="362" y="25" font-size="14" fill="#292524" text-anchor="middle">SCA / SAST / DAST 生态成熟</text>
    <rect x="520" width="315" height="40" fill="none" stroke="#e8e4de" stroke-width="0.8"/>
    <text x="677" y="25" font-size="14" fill="#292524" text-anchor="middle">AI-BOM / 行为见证 / 工具碎片化</text>
  </g>

  <!-- 结论条 -->
  <rect x="25" y="380" width="810" height="58" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="430" y="406" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">
    Agent 供应链安全不是"传统安全 + AI 组件"，而是信任模型需要根本性重构
  </text>
  <text x="430" y="425" font-size="12" fill="#78716c" text-anchor="middle">
    核心差异：依赖项在运行时可以自主改变宿主 Agent 的行为——传统供应链无此维度
  </text>
</svg>