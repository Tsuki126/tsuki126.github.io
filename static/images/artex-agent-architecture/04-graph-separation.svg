<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ARTEX 双图分离</title>
  <desc id="desc">图示资产图跨任务共享事实，两个探索图分别保存调查目标和结论，并通过锚点关联共享资产而不共享任务假设。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53616d"/></marker>
    <marker id="arrow-dash" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a6845"/></marker>
    <style>
      .bg{fill:#fbfbfa}.zone{fill:#f6f7f8;stroke:#dfe3e7;stroke-width:1}
      .zoneLabel{font:600 13px "PingFang SC","Noto Sans CJK SC",sans-serif;fill:#6f7a84;letter-spacing:1.1px}
      .asset{fill:#e9f2ee;stroke:#4e7667;stroke-width:1.2;rx:8}
      .explore{fill:#eaf0f6;stroke:#55708c;stroke-width:1.2;rx:8}
      .finding{fill:#f7f0e7;stroke:#91693f;stroke-width:1.2;rx:8}
      .text{font:500 18px "PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17202a}
      .small{font:400 15px "PingFang SC","Noto Sans CJK SC",sans-serif;fill:#66717c}
      .label{font:500 14px "PingFang SC","Noto Sans CJK SC",sans-serif;fill:#5d6974}
      .line{fill:none;stroke:#53616d;stroke-width:1.4;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#8a6845;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#arrow-dash)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>

  <text class="zoneLabel" x="54" y="46">ARTEX 双图分离</text>
  <g transform="translate(824 34)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#53616d" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text class="label" x="40" y="5">调查内派生</text>
    <line x1="148" y1="0" x2="178" y2="0" stroke="#8a6845" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arrow-dash)"/>
    <text class="label" x="188" y="5">资产锚点</text>
  </g>

  <rect class="zone" x="44" y="66" width="1112" height="218" rx="8"/>
  <text class="zoneLabel" x="70" y="96">资产图：跨任务共享的客观事实</text>

  <rect class="asset" x="84" y="128" width="156" height="66"/>
  <text class="text" x="162" y="154" text-anchor="middle">根域名</text>
  <text class="small" x="162" y="178" text-anchor="middle">组织资产边界</text>
  <rect class="asset" x="300" y="128" width="156" height="66"/>
  <text class="text" x="378" y="154" text-anchor="middle">子域名</text>
  <text class="small" x="378" y="178" text-anchor="middle">公网暴露入口</text>
  <rect class="asset" x="516" y="128" width="156" height="66"/>
  <text class="text" x="594" y="154" text-anchor="middle">服务与应用</text>
  <text class="small" x="594" y="178" text-anchor="middle">运行与业务单元</text>
  <rect class="asset" x="732" y="128" width="156" height="66"/>
  <text class="text" x="810" y="154" text-anchor="middle">接口端点</text>
  <text class="small" x="810" y="178" text-anchor="middle">可访问路径</text>
  <rect class="asset" x="948" y="128" width="164" height="66"/>
  <text class="text" x="1030" y="154" text-anchor="middle">归属关系</text>
  <text class="small" x="1030" y="178" text-anchor="middle">业务与责任人</text>
  <path class="line" d="M240 161 H300"/>
  <path class="line" d="M456 161 H516"/>
  <path class="line" d="M672 161 H732"/>
  <path class="line" d="M888 161 H948"/>
  <text class="label" x="270" y="147" text-anchor="middle">包含</text>
  <text class="label" x="486" y="147" text-anchor="middle">运行</text>
  <text class="label" x="702" y="147" text-anchor="middle">暴露</text>
  <text class="label" x="918" y="147" text-anchor="middle">归属</text>

  <rect class="zone" x="60" y="314" width="520" height="338" rx="8"/>
  <text class="zoneLabel" x="86" y="344">调查 A：独立假设与证据</text>
  <rect class="explore" x="110" y="382" width="150" height="62"/>
  <text class="text" x="185" y="412" text-anchor="middle">Goal A</text>
  <rect class="explore" x="300" y="382" width="150" height="62"/>
  <text class="text" x="375" y="412" text-anchor="middle">Intent A</text>
  <rect class="explore" x="300" y="500" width="150" height="62"/>
  <text class="text" x="375" y="530" text-anchor="middle">Fact A</text>
  <rect class="finding" x="490" y="500" width="86" height="62"/>
  <text class="text" x="533" y="530" text-anchor="middle">Finding</text>
  <path class="line" d="M260 413 H300"/>
  <path class="line" d="M375 444 V500"/>
  <path class="line" d="M450 531 H490"/>
  <text class="label" x="280" y="370" text-anchor="middle">派生</text>
  <text class="label" x="391" y="476">产出</text>
  <text class="label" x="470" y="516" text-anchor="middle">支持</text>
  <path class="dash" d="M300 531 H270 V284 H378 V194"/>
  <text class="label" x="260" y="304" text-anchor="end">锚定</text>

  <rect class="zone" x="620" y="314" width="520" height="338" rx="8"/>
  <text class="zoneLabel" x="646" y="344">调查 B：独立假设与证据</text>
  <rect class="explore" x="670" y="382" width="150" height="62"/>
  <text class="text" x="745" y="412" text-anchor="middle">Goal B</text>
  <rect class="explore" x="860" y="382" width="150" height="62"/>
  <text class="text" x="935" y="412" text-anchor="middle">Intent B</text>
  <rect class="explore" x="770" y="500" width="150" height="62"/>
  <text class="text" x="845" y="530" text-anchor="middle">Fact B</text>
  <rect class="finding" x="960" y="500" width="86" height="62"/>
  <text class="text" x="1003" y="530" text-anchor="middle">Finding</text>
  <path class="line" d="M820 413 H860"/>
  <path class="line" d="M935 444 V480 H845 V500"/>
  <path class="line" d="M920 531 H960"/>
  <text class="label" x="840" y="370" text-anchor="middle">派生</text>
  <text class="label" x="951" y="476">产出</text>
  <text class="label" x="940" y="516" text-anchor="middle">支持</text>
  <path class="dash" d="M845 500 V284 H810 V194"/>
  <text class="label" x="835" y="304" text-anchor="end">锚定</text>

  <line x1="600" y1="322" x2="600" y2="644" stroke="#cbd2d8" stroke-width="1.2" stroke-dasharray="3 5"/>
  <text class="label" x="600" y="668" text-anchor="middle">调查之间不存在推理边</text>
</svg>
