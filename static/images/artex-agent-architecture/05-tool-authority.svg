<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ARTEX 工具授权边界</title>
  <desc id="desc">图示 Worker 的请求先经过规则匹配，规则未命中才进入可选模型审查，高风险动作再进入人工审批；最终权限由策略和基础设施边界约束。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53616d"/></marker>
    <marker id="arrow-dash" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a6845"/></marker>
    <style>
      .bg{fill:#fbfbfa}.zone{fill:#f6f7f8;stroke:#dfe3e7;stroke-width:1}
      .zoneLabel{font:600 13px "PingFang SC","Noto Sans CJK SC",sans-serif;fill:#6f7a84;letter-spacing:1.1px}
      .model{fill:#eaf0f6;stroke:#55708c;stroke-width:1.2;rx:8}
      .control{fill:#f7f0e7;stroke:#91693f;stroke-width:1.2;rx:8}
      .allow{fill:#e9f2ee;stroke:#4e7667;stroke-width:1.2;rx:8}
      .deny{fill:#f3eeee;stroke:#8a6262;stroke-width:1.2;rx:8}
      .text{font:500 18px "PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17202a}
      .small{font:400 15px "PingFang SC","Noto Sans CJK SC",sans-serif;fill:#66717c}
      .label{font:500 14px "PingFang SC","Noto Sans CJK SC",sans-serif;fill:#5d6974}
      .line{fill:none;stroke:#53616d;stroke-width:1.45;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#8a6845;stroke-width:1.45;stroke-dasharray:7 5;marker-end:url(#arrow-dash)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="zoneLabel" x="54" y="46">ARTEX 工具授权边界</text>
  <g transform="translate(808 34)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#53616d" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text class="label" x="40" y="5">直接流程</text>
    <line x1="146" y1="0" x2="176" y2="0" stroke="#8a6845" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arrow-dash)"/>
    <text class="label" x="186" y="5">升级路径</text>
  </g>

  <rect class="zone" x="44" y="66" width="1112" height="396" rx="8"/>
  <text class="zoneLabel" x="70" y="96">单次工具调用的决策路径</text>

  <rect class="model" x="70" y="150" width="154" height="72"/>
  <text class="text" x="147" y="181" text-anchor="middle">Worker</text>
  <text class="small" x="147" y="205" text-anchor="middle">提出工具与参数</text>
  <rect class="control" x="268" y="150" width="174" height="72"/>
  <text class="text" x="355" y="181" text-anchor="middle">Guard</text>
  <text class="small" x="355" y="205" text-anchor="middle">统一执行前检查</text>
  <rect class="control" x="486" y="150" width="182" height="72"/>
  <text class="text" x="577" y="181" text-anchor="middle">规则匹配</text>
  <text class="small" x="577" y="205" text-anchor="middle">allow / deny / ask</text>
  <path class="line" d="M224 186 H268"/>
  <path class="line" d="M442 186 H486"/>
  <text class="label" x="246" y="171" text-anchor="middle">请求</text>
  <text class="label" x="464" y="171" text-anchor="middle">检查</text>

  <rect class="model" x="486" y="300" width="182" height="72"/>
  <text class="text" x="577" y="331" text-anchor="middle">可选模型审查</text>
  <text class="small" x="577" y="355" text-anchor="middle">只处理规则未覆盖项</text>
  <path class="dash" d="M577 222 V300"/>
  <text class="label" x="597" y="260">规则未命中</text>

  <rect class="allow" x="940" y="94" width="156" height="68"/>
  <text class="text" x="1018" y="124" text-anchor="middle">允许</text>
  <text class="small" x="1018" y="147" text-anchor="middle">进入工具执行</text>
  <rect class="control" x="746" y="194" width="164" height="68"/>
  <text class="text" x="828" y="224" text-anchor="middle">询问</text>
  <text class="small" x="828" y="247" text-anchor="middle">创建人工审批</text>
  <rect class="deny" x="940" y="294" width="156" height="68"/>
  <text class="text" x="1018" y="324" text-anchor="middle">拒绝</text>
  <text class="small" x="1018" y="347" text-anchor="middle">返回平台策略原因</text>
  <path class="line" d="M668 186 H706 V128 H940"/>
  <path class="line" d="M668 186 H746"/>
  <path class="line" d="M668 186 H706 V328 H940"/>
  <text class="label" x="699" y="112" text-anchor="middle">允许</text>
  <text class="label" x="707" y="173" text-anchor="middle">询问</text>
  <text class="label" x="699" y="312" text-anchor="middle">拒绝</text>

  <rect class="control" x="940" y="194" width="156" height="68"/>
  <text class="text" x="1018" y="224" text-anchor="middle">人工审批</text>
  <text class="small" x="1018" y="247" text-anchor="middle">批准或拒绝</text>
  <path class="line" d="M910 228 H940"/>
  <path class="line" d="M1018 194 V162"/>
  <path class="line" d="M1018 262 V294"/>
  <text class="label" x="1028" y="180">批准</text>
  <text class="label" x="1028" y="284">拒绝</text>
  <path class="line" d="M668 372 H704 V128 H940"/>
  <text class="label" x="688" y="390">同构结果</text>

  <text class="small" x="70" y="430">拒绝信息必须标记为“平台管控”，不能让 Agent 误认为目标系统防御而继续绕过。</text>

  <rect class="zone" x="44" y="490" width="1112" height="190" rx="8"/>
  <text class="zoneLabel" x="70" y="520">控制强度逐级增加</text>
  <rect class="model" x="72" y="548" width="284" height="88"/>
  <text class="text" x="214" y="580" text-anchor="middle">任务范围 / Prompt</text>
  <text class="small" x="214" y="606" text-anchor="middle">表达意图，不能阻止越界</text>
  <rect class="control" x="430" y="548" width="284" height="88"/>
  <text class="text" x="572" y="580" text-anchor="middle">Guard / Policy</text>
  <text class="small" x="572" y="606" text-anchor="middle">拒绝被识别的危险动作</text>
  <rect class="allow" x="788" y="548" width="336" height="88"/>
  <text class="text" x="956" y="580" text-anchor="middle">身份 / 网络 / Sandbox</text>
  <text class="small" x="956" y="606" text-anchor="middle">让越界访问在基础设施层失败</text>
  <path class="line" d="M356 592 H430"/>
  <path class="line" d="M714 592 H788"/>
</svg>
