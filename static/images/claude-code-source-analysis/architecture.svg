  <rect x="452" y="230" width="350" height="30" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="627" y="249" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">setup.ts · migration</text>

