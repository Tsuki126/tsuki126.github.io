  <text x="42" y="84" font-size="13" font-weight="600" fill="#d97706">Entrypoints</text>
  <text x="135" y="84" font-size="11" fill="#a8a29e">│ CLI 快速路径与初始化</text>
  <!-- 2 cards: cli.tsx, init.ts -->
  <rect x="75" y="102" width="350" height="30" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="250" y="121" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">entrypoints/cli.tsx</text>
  <rect x="452" y="102" width="350" height="30" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="627" y="121" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">entrypoints/init.ts</text>

  <!-- Arrow Layer 1 → 2 -->
  <line x1="440" y1="148" x2="440" y2="184" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#ar)"/>
