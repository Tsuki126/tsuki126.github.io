  <text x="42" y="468" font-size="13" font-weight="600" fill="#d97706">Core Services</text>
  <text x="135" y="468" font-size="11" fill="#a8a29e">│ AI 交互循环与工具执行</text>
  <!-- 3 cards: QueryEngine, Tools, MCP -->
  <rect x="83" y="486" width="220" height="30" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="193" y="505" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">QueryEngine + query()</text>
  <rect x="330" y="486" width="220" height="30" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="440" y="505" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">Tool System (43)</text>
  <rect x="577" y="486" width="220" height="30" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="687" y="505" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">MCP · Analytics · LSP</text>
