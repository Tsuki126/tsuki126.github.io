  <rect x="577" y="358" width="220" height="30" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="687" y="377" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">components/ (144+)</text>

  <!-- Arrow Layer 3 → 4 -->
