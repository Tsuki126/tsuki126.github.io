<svg viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#292524" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="860" height="540" fill="#faf8f5"/>
  <text x="430" y="32" font-size="17" font-weight="700" fill="#292524" text-anchor="middle">Skill · Plugin · MCP 对比</text>

  <!-- Header row -->
  <rect x="25" y="60" width="180" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="115" y="84" font-size="12" font-weight="600" fill="#292524" text-anchor="middle">维度</text>

  <rect x="205" y="60" width="203" height="38" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="306" y="84" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">Skill</text>

  <rect x="408" y="60" width="203" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="509" y="84" font-size="12" font-weight="600" fill="#292524" text-anchor="middle">Plugin</text>

  <rect x="611" y="60" width="224" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="723" y="84" font-size="12" font-weight="600" fill="#292524" text-anchor="middle">MCP</text>

  <!-- Row 1: 实现成本 -->
  <rect x="25" y="98" width="180" height="38" rx="0" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="115" y="122" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">实现成本</text>

  <rect x="205" y="98" width="203" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="306" y="122" font-size="12" fill="#292524" text-anchor="middle">低（一个 prompt 函数）</text>

  <rect x="408" y="98" width="203" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="509" y="122" font-size="12" fill="#292524" text-anchor="middle">中（完整注册流程）</text>

  <rect x="611" y="98" width="224" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="723" y="122" font-size="12" fill="#292524" text-anchor="middle">低（使用现有 Server）</text>

  <!-- Row 2: 能力范围 -->
  <rect x="25" y="136" width="180" height="38" rx="0" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="115" y="160" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">能力范围</text>

  <rect x="205" y="136" width="203" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="306" y="160" font-size="12" fill="#292524" text-anchor="middle">修改上下文 + 控制权限</text>

  <rect x="408" y="136" width="203" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="509" y="160" font-size="12" fill="#292524" text-anchor="middle">Skill + Hook + MCP Server</text>

  <rect x="611" y="136" width="224" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="723" y="160" font-size="12" fill="#292524" text-anchor="middle">独立 Tool/Resource 集合</text>

  <!-- Row 3: 用户可见性 -->
  <rect x="25" y="174" width="180" height="38" rx="0" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="115" y="198" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">用户可见性</text>

  <rect x="205" y="174" width="203" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="306" y="198" font-size="12" fill="#292524" text-anchor="middle">`/skill` 斜杠命令</text>

  <rect x="408" y="174" width="203" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="509" y="198" font-size="12" fill="#292524" text-anchor="middle">`/plugin` 管理面板</text>

  <rect x="611" y="174" width="224" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="723" y="198" font-size="12" fill="#292524" text-anchor="middle">自动注册到工具池</text>

  <!-- Row 4: 跨应用复用 -->
  <rect x="25" y="212" width="180" height="38" rx="0" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="115" y="236" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">跨应用复用</text>

  <rect x="205" y="212" width="203" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="306" y="236" font-size="12" fill="#292524" text-anchor="middle">否（Claude Code 特有）</text>

  <rect x="408" y="212" width="203" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="509" y="236" font-size="12" fill="#292524" text-anchor="middle">否（Claude Code 特有）</text>

  <rect x="611" y="212" width="224" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="723" y="236" font-size="12" fill="#292524" text-anchor="middle">是（开放标准协议）</text>

  <!-- Row 5: 典型用途 -->
  <rect x="25" y="250" width="180" height="38" rx="0" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="115" y="274" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">典型用途</text>

  <rect x="205" y="250" width="203" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="306" y="274" font-size="12" fill="#292524" text-anchor="middle">/debug · /simplify · /verify</text>

  <rect x="408" y="250" width="203" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="509" y="274" font-size="12" fill="#292524" text-anchor="middle">MCP Server 集成 · 扩展集</text>

  <rect x="611" y="250" width="224" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="723" y="274" font-size="12" fill="#292524" text-anchor="middle">数据库 · Filesystem · 搜索</text>

  <!-- Row 6: 注册方式 -->
  <rect x="25" y="288" width="180" height="38" rx="0" fill="#f5f5f4" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="115" y="312" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">注册方式</text>

  <rect x="205" y="288" width="203" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="306" y="312" font-size="12" fill="#292524" text-anchor="middle">initBundledSkills()</text>

  <rect x="408" y="288" width="203" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="509" y="312" font-size="12" fill="#292524" text-anchor="middle">registerBuiltinPlugin()</text>

  <rect x="611" y="288" width="224" height="38" rx="0" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="723" y="312" font-size="12" fill="#292524" text-anchor="middle">MCP 客户端动态连接</text>

  <!-- Conclusion bar -->
  <rect x="25" y="340" width="810" height="52" rx="5" fill="#fef3c7" stroke="#e8e4de" stroke-width="0.8"/>
  <text x="430" y="362" font-size="13" font-weight="600" fill="#d97706" text-anchor="middle">选型建议</text>
  <text x="430" y="380" font-size="11" fill="#78716c" text-anchor="middle">简单命令用 Skill · 复杂扩展用 Plugin · 外部服务用 MCP</text>
</svg>
