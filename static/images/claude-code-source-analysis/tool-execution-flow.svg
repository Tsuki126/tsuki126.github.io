<svg viewBox="0 0 580 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 6" refX="9.5" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#a8a29e"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 6" refX="9.5" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#292524" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="580" height="620" fill="#faf8f5"/>
  <text x="290" y="32" font-size="17" font-weight="700" fill="#292524" text-anchor="middle">工具执行管道</text>

  <!-- Step 1: API Response -->
  <rect x="170" y="60" width="240" height="36" rx="18" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="290" y="83" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">API 响应 → tool_use 块</text>

  <line x1="290" y1="96" x2="290" y2="126" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="310" y="116" font-size="10" fill="#a8a29e">parseToolUseBlocks</text>

  <!-- Step 2: Partition -->
  <rect x="170" y="130" width="240" height="36" rx="18" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="290" y="153" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">分区调度</text>

  <line x1="290" y1="166" x2="290" y2="196" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="310" y="186" font-size="10" fill="#a8a29e">partitionToolCalls</text>

  <!-- Branch labels -->
  <text x="160" y="210" font-size="10" fill="#78716c" text-anchor="end">并发安全</text>
  <text x="420" y="210" font-size="10" fill="#78716c" text-anchor="start">串行执行</text>

  <line x1="210" y1="200" x2="210" y2="226" stroke="#a8a29e" stroke-width="1"/>
  <line x1="370" y1="200" x2="370" y2="226" stroke="#a8a29e" stroke-width="1"/>

  <!-- Step 3: Permission Check -->
  <rect x="170" y="230" width="240" height="36" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="290" y="253" font-size="12" font-weight="500" fill="#d97706" text-anchor="middle">权限检查</text>

  <line x1="170" y1="248" x2="82" y2="248" stroke="#a8a29e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="72" y="244" font-size="10" fill="#a8a29e" text-anchor="end">配置规则</text>

  <line x1="410" y1="248" x2="498" y2="248" stroke="#a8a29e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="508" y="244" font-size="10" fill="#a8a29e" text-anchor="start">自动分类器</text>

  <line x1="290" y1="266" x2="290" y2="296" stroke="#d97706" stroke-width="1.5" marker-end="url(#ar-blue)"/>
  <text x="310" y="286" font-size="10" fill="#d97706">canUseTool</text>

  <!-- Step 4: Interactive dialog (optional) -->
  <rect x="170" y="300" width="240" height="36" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" stroke-dasharray="5 3" filter="url(#shadow)"/>
  <text x="290" y="323" font-size="12" font-weight="400" fill="#78716c" text-anchor="middle">交互弹窗（按需）</text>

  <line x1="290" y1="336" x2="290" y2="366" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 5: Tool Execution -->
  <rect x="170" y="370" width="240" height="36" rx="5" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="290" y="393" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">tool.call(input, context)</text>

  <line x1="290" y1="406" x2="290" y2="436" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 6: Result mapping -->
  <rect x="170" y="440" width="240" height="36" rx="18" fill="#ffffff" stroke="#e8e4de" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="290" y="463" font-size="12" font-weight="500" fill="#292524" text-anchor="middle">结果映射</text>

  <line x1="290" y1="476" x2="290" y2="506" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 7: Loop Decision -->
  <polygon points="290,510 370,530 290,550 210,530" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="290" y="534" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">是否继续?</text>

  <line x1="210" y1="530" x2="90" y2="530" stroke="#a8a29e" stroke-width="1"/>
  <text x="80" y="526" font-size="10" fill="#a8a29e" text-anchor="end">是 → 下一轮</text>

  <line x1="370" y1="530" x2="490" y2="530" stroke="#a8a29e" stroke-width="1"/>
  <text x="500" y="526" font-size="10" fill="#a8a29e" text-anchor="start">否 → 输出</text>

  <!-- Phase labels on the right -->
  <text x="540" y="85" font-size="10" fill="#a8a29e" text-anchor="end">解析</text>
  <text x="540" y="155" font-size="10" fill="#a8a29e" text-anchor="end">调度</text>
  <text x="540" y="253" font-size="10" fill="#a8a29e" text-anchor="end">权限</text>
  <text x="540" y="395" font-size="10" fill="#a8a29e" text-anchor="end">执行</text>
  <text x="540" y="465" font-size="10" fill="#a8a29e" text-anchor="end">回注</text>
</svg>
