<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { fill: #1a1a2e; font-size: 13px; font-weight: 600; }
    .box-bg { fill: #d4e1f5; }
    .box-text { fill: #1a1a2e; }
    .box-sub { fill: #1a1a2e; font-size: 12px; }
    .end-bg { fill: #cfe6d4; }
    .white-bg { fill: #ffffff; stroke: #b0b8c8; stroke-width: 1; }
    .layer-border { stroke: #b0b8c8; stroke-width: 1.5; fill: none; rx: 8; }
  </style>

  <!-- Layer 1 (bottom): 核心循环 -->
  <rect x="40" y="250" width="640" height="120" rx="8" class="layer-border"/>
  <rect x="40" y="250" width="640" height="32" rx="8" class="box-bg"/>
  <rect x="40" y="274" width="640" height="8" fill="#d4e1f5"/>
  <text x="60" y="271" class="title">底层：单一主循环</text>

  <rect x="150" y="294" width="420" height="60" rx="6" class="white-bg"/>
  <text x="360" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">调用模型 → 检查是否有 tool_use</text>
  <text x="360" y="335" text-anchor="middle" font-size="12" fill="#1a1a2e">有 → 执行工具，结果回传，continue　／　无 → 输出回答，终止</text>

  <!-- Layer 2 (middle): 能力支撑 -->
  <rect x="40" y="130" width="640" height="110" rx="8" class="layer-border"/>
  <rect x="40" y="130" width="640" height="32" rx="8" class="box-bg"/>
  <rect x="40" y="154" width="640" height="8" fill="#d4e1f5"/>
  <text x="60" y="151" class="title">中间层：工具系统与上下文管理</text>

  <!-- Tool System -->
  <rect x="58" y="174" width="290" height="52" rx="6" class="white-bg"/>
  <text x="203" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">工具系统</text>
  <text x="203" y="212" text-anchor="middle" font-size="11" fill="#1a1a2e">各工具提供 prompt 片段 → 动态拼接 system prompt</text>
  <text x="203" y="224" text-anchor="middle" font-size="11" fill="#1a1a2e">只读工具可并行，写操作串行</text>

  <!-- Context Mgmt -->
  <rect x="368" y="174" width="294" height="52" rx="6" class="white-bg"/>
  <text x="515" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">上下文管理</text>
  <text x="515" y="212" text-anchor="middle" font-size="11" fill="#1a1a2e">自动摘要 → 截断 → 微压缩</text>
  <text x="515" y="224" text-anchor="middle" font-size="11" fill="#1a1a2e">→ 塌缩，逐级压缩</text>

  <!-- Layer 3 (top): 模式控制 -->
  <rect x="40" y="20" width="640" height="100" rx="8" class="layer-border"/>
  <rect x="40" y="20" width="640" height="32" rx="8" class="box-bg"/>
  <rect x="40" y="44" width="640" height="8" fill="#d4e1f5"/>
  <text x="60" y="41" class="title">上层：模式切换（不改变循环，只改变输入）</text>

  <rect x="58" y="64" width="190" height="42" rx="6" class="white-bg"/>
  <text x="153" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">规划模式</text>
  <text x="153" y="98" text-anchor="middle" font-size="11" fill="#1a1a2e">权限标记 → 只读工具 → 用户确认</text>

  <rect x="260" y="64" width="190" height="42" rx="6" class="white-bg"/>
  <text x="355" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">子智能体</text>
  <text x="355" y="98" text-anchor="middle" font-size="11" fill="#1a1a2e">隔离上下文，嵌套 queryLoop</text>

  <rect x="462" y="64" width="200" height="42" rx="6" class="white-bg"/>
  <text x="562" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">Extended Thinking</text>
  <text x="562" y="98" text-anchor="middle" font-size="11" fill="#1a1a2e">API 参数控制，内部 thinking block</text>

  <!-- Error bar -->
  <rect x="40" y="385" width="640" height="42" rx="6" class="end-bg" stroke="#b0b8c8" stroke-width="1.5"/>
  <text x="360" y="403" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">贯穿所有层：错误处理</text>
  <text x="360" y="419" text-anchor="middle" font-size="11" fill="#1a1a2e">基础设施错误（API 失败 / 上下文超限）→ 宿主侧重试　｜　工具逻辑错误 → error: true 回传 LLM，模型自行恢复</text>
</svg>