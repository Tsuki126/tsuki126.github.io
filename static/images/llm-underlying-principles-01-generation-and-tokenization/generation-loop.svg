<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="820" height="420" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="410" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">自回归生成循环</text>

  <!-- 步骤 1：输入文本 -->
  <rect x="60" y="60" width="160" height="50" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#3b82f6">输入文本</text>
  <text x="140" y="74" text-anchor="middle" font-size="10" fill="#64748b">"The cat sat"</text>

  <line x1="220" y1="85" x2="270" y2="85" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 步骤 2：Tokenizer -->
  <rect x="270" y="60" width="160" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="350" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">BPE Tokenizer</text>
  <text x="350" y="98" text-anchor="middle" font-size="10" fill="#64748b">文本 → token ID 序列</text>

  <line x1="430" y1="85" x2="480" y2="85" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 步骤 3：模型 -->
  <rect x="480" y="60" width="160" height="50" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#3b82f6">Transformer</text>
  <text x="560" y="98" text-anchor="middle" font-size="10" fill="#64748b">前向传播计算</text>

  <line x1="640" y1="85" x2="690" y2="85" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 步骤 4：Softmax -->
  <rect x="690" y="60" width="110" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="745" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Softmax</text>
  <text x="745" y="98" text-anchor="middle" font-size="10" fill="#64748b">分数→概率</text>

  <!-- 下方流程区 -->
  <rect x="60" y="145" width="740" height="250" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Logits 可视化 -->
  <text x="410" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">模型输出 logits（词汇表大小 = 50257）</text>

  <rect x="80" y="180" width="700" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- logits 拉伸图 -->
  <rect x="90" y="188" width="20" height="20" rx="2" fill="#e2e8f0"/>
  <text x="100" y="202" text-anchor="middle" font-size="8" fill="#64748b">-2.3</text>
  <rect x="118" y="183" width="24" height="30" rx="2" fill="#3b82f6"/>
  <text x="130" y="202" text-anchor="middle" font-size="8" fill="#fff">5.1</text>
  <rect x="152" y="192" width="18" height="16" rx="2" fill="#e2e8f0"/>
  <text x="161" y="203" text-anchor="middle" font-size="8" fill="#64748b">0.7</text>
  <rect x="180" y="196" width="16" height="10" rx="2" fill="#e2e8f0"/>
  <text x="188" y="203" text-anchor="middle" font-size="8" fill="#64748b">-1.8</text>
  <rect x="206" y="186" width="22" height="26" rx="2" fill="#10b981"/>
  <text x="217" y="202" text-anchor="middle" font-size="8" fill="#fff">3.2</text>
  <text x="250" y="202" text-anchor="middle" font-size="9" fill="#94a3b8">... 50252 个 logits ...</text>
  <rect x="440" y="195" width="14" height="10" rx="2" fill="#e2e8f0"/>
  <text x="447" y="202" text-anchor="middle" font-size="8" fill="#64748b">-1.1</text>
  <rect x="462" y="192" width="18" height="16" rx="2" fill="#e2e8f0"/>
  <text x="471" y="203" text-anchor="middle" font-size="8" fill="#64748b">0.3</text>
  <rect x="490" y="196" width="16" height="10" rx="2" fill="#e2e8f0"/>
  <text x="498" y="203" text-anchor="middle" font-size="8" fill="#64748b">-0.4</text>

  <!-- Softmax 箭头 -->
  <line x1="410" y1="218" x2="410" y2="236" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="230" font-size="10" fill="#3b82f6" font-style="italic">softmax</text>

  <!-- 概率分布 -->
  <rect x="80" y="238" width="700" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="90" y="246" width="26" height="20" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="103" y="260" text-anchor="middle" font-size="8" fill="#64748b">0.1%</text>
  <rect x="124" y="240" width="100" height="32" rx="2" fill="#3b82f6"/>
  <text x="174" y="260" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">~52%</text>
  <rect x="232" y="248" width="24" height="18" rx="2" fill="#e2e8f0"/>
  <text x="244" y="260" text-anchor="middle" font-size="8" fill="#64748b">3%</text>
  <rect x="264" y="254" width="18" height="10" rx="2" fill="#e2e8f0"/>
  <text x="273" y="261" text-anchor="middle" font-size="8" fill="#64748b">0.2%</text>
  <rect x="290" y="244" width="56" height="26" rx="2" fill="#10b981"/>
  <text x="318" y="260" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">~18%</text>
  <text x="390" y="260" text-anchor="middle" font-size="9" fill="#94a3b8">... 50252 个概率 ...</text>
  <rect x="540" y="253" width="12" height="10" rx="2" fill="#e2e8f0"/>
  <rect x="558" y="250" width="14" height="14" rx="2" fill="#e2e8f0"/>
  <rect x="578" y="253" width="12" height="10" rx="2" fill="#e2e8f0"/>
  <rect x="596" y="248" width="18" height="16" rx="2" fill="#e2e8f0"/>

  <!-- 采样 -->
  <line x1="410" y1="276" x2="410" y2="294" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="288" font-size="10" fill="#3b82f6" font-style="italic">采样<br/>T=0.7</text>

  <!-- 采样结果 -->
  <rect x="310" y="296" width="200" height="40" rx="5" fill="#10b981" stroke="#10b981" stroke-width="1.5"/>
  <text x="410" y="316" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">选出 token: "quantum"</text>
  <text x="410" y="330" text-anchor="middle" font-size="10" fill="#fff">token_id = 3392</text>

  <!-- 循环回输入 -->
  <path d="M 560 336 L 560 360 L 140 360 L 140 110" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#arrow)"/>

  <rect x="250" y="352" width="160" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="330" y="368" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">拼回输入序列，继续循环</text>

  <!-- 循环标注 -->
  <text x="560" y="355" font-size="10" fill="#f59e0b" font-style="italic">自回归循环</text>

  <!-- 次数标注 -->
  <rect x="620" y="300" width="160" height="28" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="700" y="319" text-anchor="middle" font-size="11" fill="#64748b">重复直到 &lt;EOS&gt; 或 max_tokens</text>

  <!-- 图注 -->
  <text x="410" y="405" text-anchor="middle" font-size="10" fill="#94a3b8">每一步只生成一个 token，然后拼回输入序列继续</text>
</svg>
