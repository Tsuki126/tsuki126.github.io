<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="860" height="580">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#292524" flood-opacity="0.04"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 6" refX="9.5" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#a8a29e"/>
    </marker>
  </defs>

  <!-- 画布背景 -->
  <rect width="860" height="580" fill="#faf8f5"/>

  <!-- 图标题 -->
  <text x="430" y="38" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#292524">SCA 核心能力层次：从地基到落地</text>

  <!-- ============================================================ -->
  <!-- 分组 1：地基层（SBOM 生成）-->
  <!-- ============================================================ -->
  <g>
    <!-- 分组背景 -->
    <rect x="50" y="70" width="760" height="100" rx="8" fill="#f5f5f4" stroke="#e8e4de" stroke-width="1"/>
    <!-- 分组标题 -->
    <text x="70" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#d97706">地基层：SBOM 生成与依赖发现</text>
    <!-- 描述 -->
    <text x="250" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#a8a29e">│ 确定"项目用了什么"是后续一切分析的前提</text>
    <!-- 概念项 -->
    <text x="76" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#292524">▪ 依赖发现：manifest / lockfile / 二进制指纹多种途径</text>
    <text x="76" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#292524">▪ SBOM 格式输出：CycloneDX（偏漏洞管理）vs SPDX（偏许可证）</text>
    <text x="76" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#292524">▪ 持续更新：增量扫描 vs 全量重建，决定 CI 集成成本</text>
  </g>

  <!-- 箭头 1 -->
  <line x1="430" y1="170" x2="430" y2="181" stroke="#a8a29e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="442" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#a8a29e">输出依赖清单</text>

  <!-- ============================================================ -->
  <!-- 分组 2：风险识别层 -->
  <!-- ============================================================ -->
  <g>
    <rect x="50" y="188" width="760" height="100" rx="8" fill="#f5f5f4" stroke="#e8e4de" stroke-width="1"/>
    <text x="70" y="213" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#d97706">风险层：漏洞检测与许可证合规</text>
    <text x="250" y="213" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#a8a29e">│ 匹配已知风险——但"有风险"≠"可利用"</text>
    <text x="76" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#292524">▪ CVE 匹配：将组件版本与 NVD / 厂商漏洞库交叉对比</text>
    <text x="76" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#292524">▪ 许可证检测：识别 GPL / MIT / Apache 等合规风险</text>
    <text x="76" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#292524">▪ 恶意包检测：识别依赖混淆 / 投毒 / code shadowing 攻击</text>
  </g>

  <!-- 箭头 2 -->
  <line x1="430" y1="288" x2="430" y2="299" stroke="#a8a29e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="442" y="298" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#a8a29e">输入风险信号</text>

  <!-- ============================================================ -->
  <!-- 分组 3：精度层（主题色强调）-->
  <!-- ============================================================ -->
  <g>
    <rect x="50" y="306" width="760" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="70" y="331" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#d97706">精度层：分析筛选与误报管控</text>
    <text x="250" y="331" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#a8a29e">│ 消除噪声的核心——决定 SCA 能否落地</text>
    <text x="76" y="356" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#292524">▪ 版本匹配：pkg@version 查 CVE（最基础，误报最高）</text>
    <text x="76" y="378" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#292524">▪ 包级可达：判断 package 是否被调用（减少 20-40% 噪声）</text>
    <text x="76" y="400" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#292524">▪ 函数级可达：PTA 分析实际调用路径（减少 90%+ 噪声）</text>
  </g>

  <!-- 箭头 3 -->
  <line x1="430" y1="406" x2="430" y2="417" stroke="#a8a29e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="442" y="416" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#a8a29e">输出决策指令</text>

  <!-- ============================================================ -->
  <!-- 分组 4：策略执行层 -->
  <!-- ============================================================ -->
  <g>
    <rect x="50" y="424" width="760" height="100" rx="8" fill="#f5f5f4" stroke="#e8e4de" stroke-width="1"/>
    <text x="70" y="449" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#d97706">策略层：门禁控制与自动修复</text>
    <text x="250" y="449" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#a8a29e">│ 让 SCA 从"报告"变成"门禁"——产生工程影响</text>
    <text x="76" y="474" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#292524">▪ 门禁控制：按严重度 / 可达性 / 许可证类型设置阻断策略</text>
    <text x="76" y="496" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#292524">▪ 自动修复：生成最小安全升级 PR，非破坏性变更自动触发</text>
    <text x="76" y="518" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#292524">▪ 合规报告：生成 SBOM + 审计追踪，满足法规合规要求</text>
  </g>
</svg>
