<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.06"/>
    </filter>
    <marker id="ar-good" viewBox="0 0 10 6" refX="9.5" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="ar-bad" viewBox="0 0 10 6" refX="9.5" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- 画布背景 -->
  <rect width="860" height="540" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="430" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1e293b">漏洞匹配：CPE 的命名歧义 vs PURL 的生态原生标识</text>

  <!-- ===== 左侧: CPE 方案 ===== -->
  <rect x="30" y="66" width="395" height="20" rx="4" fill="#fee2e2" stroke="none"/>
  <text x="227" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#dc2626">CPE 方案：中心化命名 → 歧义 → 误报</text>

  <!-- 示例: 同一个包在不同 CVE 中的不同 CPE -->
  <rect x="30" y="96" width="395" height="38" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="50" y="112" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1e293b">CVE-2021-23337</text>
  <text x="190" y="112" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">→ cpe:2.3:a:</text><text x="320" y="112" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#ef4444">lodash</text><text x="370" y="112" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">:...</text>
  <text x="50" y="128" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">该 CVE 将厂商记为 "lodash"</text>

  <rect x="30" y="142" width="395" height="38" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="50" y="158" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1e293b">CVE-2018-3721</text>
  <text x="190" y="158" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">→ cpe:2.3:a:</text><text x="320" y="158" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#ef4444">lodash_project</text><text x="425" y="158" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">:...</text>
  <text x="50" y="174" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">该 CVE 将厂商记为 "lodash_project" ← 同一个包，不同名字</text>

  <rect x="30" y="188" width="395" height="38" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="50" y="204" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1e293b">CVE-2021-41720</text>
  <text x="190" y="204" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">→ cpe:2.3:a:</text><text x="320" y="204" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#ef4444">lodash:lodash</text><text x="425" y="204" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">:...</text>
  <text x="50" y="220" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">该 CVE 将厂商和产品都记为 "lodash"</text>

  <!-- 歧义结论 -->
  <rect x="30" y="242" width="395" height="52" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="227" y="264" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#dc2626">CPE 需要 N 对 M 的映射表</text>
  <text x="227" y="282" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">SCA 工具必须维护"包名 → 所有可能的 CPE 写法"映射</text>

  <!-- ===== 右侧: PURL 方案 ===== -->
  <rect x="435" y="66" width="395" height="20" rx="4" fill="#dcfce7" stroke="none"/>
  <text x="632" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#16a34a">PURL 方案：生态原生命名 → 确定性 → 精确</text>

  <rect x="435" y="96" width="395" height="38" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="455" y="112" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1e293b">pkg:npm/</text><text x="525" y="112" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#10b981">lodash</text><text x="585" y="112" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">@4.17.21</text>
  <text x="455" y="128" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">命名空间 = npm 注册表，包名全局唯一</text>

  <rect x="435" y="142" width="395" height="38" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="455" y="158" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1e293b">pkg:pypi/</text><text x="525" y="158" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#10b981">django</text><text x="585" y="158" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">@4.2.0</text>
  <text x="455" y="174" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">命名空间 = PyPI 注册表，包名全局唯一</text>

  <rect x="435" y="188" width="395" height="38" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="455" y="204" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1e293b">pkg:maven/</text><text x="535" y="204" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#10b981">org.springframework</text><text x="675" y="204" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">/spring-core@5.3.12</text>
  <text x="455" y="220" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">命名空间 = Maven Central，groupId:artifactId 组合唯一</text>

  <rect x="435" y="242" width="395" height="52" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="632" y="264" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#16a34a">PURL 是 1:1 的确定性映射</text>
  <text x="632" y="282" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">每个包的 PURL 唯一，无需维护映射表</text>

  <!-- ===== 底部对比表 ===== -->
  <!-- 表头 -->
  <rect x="55" y="326" width="750" height="34" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">维度</text>
  <text x="430" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#dc2626">CPE</text>
  <text x="680" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#16a34a">PURL</text>

  <line x1="55" y1="360" x2="805" y2="360" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="305" y1="326" x2="305" y2="480" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="555" y1="326" x2="555" y2="480" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row -->
  <line x1="55" y1="392" x2="805" y2="392" stroke="#f1f5f9" stroke-width="1"/>
  <text x="180" y="380" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">命名空间来源</text>
  <text x="430" y="380" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">中心化标准定义</text>
  <text x="680" y="380" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">包管理器原生定义</text>

  <line x1="55" y1="420" x2="805" y2="420" stroke="#f1f5f9" stroke-width="1"/>
  <text x="180" y="408" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">厂商-产品歧义</text>
  <text x="430" y="408" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#ef4444">高频（同一包多 CPE）</text>
  <text x="680" y="408" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#10b981">不存在</text>

  <line x1="55" y1="448" x2="805" y2="448" stroke="#f1f5f9" stroke-width="1"/>
  <text x="180" y="436" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">映射复杂度</text>
  <text x="430" y="436" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#ef4444">N:M（需维护映射表）</text>
  <text x="680" y="436" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#10b981">1:1（确定性）</text>

  <line x1="55" y1="476" x2="805" y2="476" stroke="#f1f5f9" stroke-width="1"/>
  <text x="180" y="464" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">漏洞库支持</text>
  <text x="430" y="464" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">NVD（事实标准）</text>
  <text x="680" y="464" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">OSV、GitHub Advisory</text>

  <!-- 底线 -->
  <line x1="55" y1="480" x2="805" y2="480" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 结论 -->
  <rect x="55" y="496" width="750" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="430" y="516" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#3b82f6">生产实践中必然同时使用两种匹配，在结果层做去重与合并——NVD 的覆盖面 + PURL 的精确度</text>
</svg>
