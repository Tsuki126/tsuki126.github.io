<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 画布背景 -->
  <rect width="860" height="540" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="430" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1e293b">包指纹三种方案：精度与成本的取舍</text>

  <!-- 表头背景 -->
  <rect x="55" y="70" width="750" height="38" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- 表头文字 -->
  <text x="105" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b">对比维度</text>
  <text x="305" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">文件级哈希</text>
  <text x="555" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">片段级哈希</text>
  <text x="740" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">AST 指纹</text>

  <!-- 行分割线 -->
  <line x1="55" y1="108" x2="805" y2="108" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="55" y1="146" x2="805" y2="146" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="55" y1="184" x2="805" y2="184" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="55" y1="222" x2="805" y2="222" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="55" y1="260" x2="805" y2="260" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="55" y1="298" x2="805" y2="298" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="55" y1="336" x2="805" y2="336" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="55" y1="374" x2="805" y2="374" stroke="#108" stroke-width="1"/>

  <!-- 列分割线 -->
  <line x1="155" y1="70" x2="155" y2="412" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="405" y1="70" x2="405" y2="412" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="655" y1="70" x2="655" y2="412" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 1: 精度 -->
  <text x="105" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">精度（误报率）</text>
  <text x="305" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#10b981">极高（~0%）</text>
  <text x="555" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#10b981">中高</text>
  <text x="740" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#3b82f6">高</text>

  <!-- Row 2: 召回率 -->
  <text x="105" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">召回率（漏报率）</text>
  <text x="305" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#ef4444">低</text>
  <text x="555" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#f59e0b">中高</text>
  <text x="740" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#10b981">高</text>

  <!-- Row 3: 计算成本 -->
  <text x="105" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">计算成本</text>
  <text x="305" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#10b981">极低（O(n)）</text>
  <text x="555" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#f59e0b">中（O(n·w)）</text>
  <text x="740" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#ef4444">高（O(n·parse)）</text>

  <!-- Row 4: 抗变换能力 -->
  <text x="105" y="246" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">抗变换能力</text>
  <text x="305" y="246" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#ef4444">零</text>
  <text x="555" y="246" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#f59e0b">中（滑动窗口）</text>
  <text x="740" y="246" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#10b981">强（语义级）</text>

  <!-- Row 5: 对混淆的容忍 -->
  <text x="105" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">对混淆的容忍</text>
  <text x="305" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#ef4444">不适用</text>
  <text x="555" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#f59e0b">部分容忍</text>
  <text x="740" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#10b981">完全容忍</text>

  <!-- Row 6: 指纹库建设成本 -->
  <text x="105" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">指纹库建设成本</text>
  <text x="305" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#10b981">低</text>
  <text x="555" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#f59e0b">中</text>
  <text x="740" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#ef4444">高（需语言解析器）</text>

  <!-- Row 7: 最佳场景 -->
  <text x="105" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">最佳场景</text>
  <text x="305" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#3b82f6">官方发布包完整性校验</text>
  <text x="555" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#3b82f6">通用 SCA 批量扫描</text>
  <text x="740" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#3b82f6">混淆/压缩代码确认</text>

  <!-- 底部 -->
  <line x1="55" y1="412" x2="805" y2="412" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 结论条 -->
  <rect x="55" y="420" width="750" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="430" y="445" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#3b82f6">生产策略：文件级做初筛 → 片段级做通用匹配 → AST 指纹做高价值精确确认</text>

  <!-- 下方详述: 三层递进关系 -->
  <rect x="55" y="478" width="240" height="42" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="175" y="496" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#2563eb">第一层：快速筛查</text>
  <text x="175" y="512" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">排除与官方发布完全一致的包</text>

  <rect x="310" y="478" width="240" height="42" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="430" y="496" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1e293b">第二层：通用匹配</text>
  <text x="430" y="512" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">片段级覆盖主流包生态的大部分场景</text>

  <rect x="565" y="478" width="240" height="42" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="685" y="496" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1e293b">第三层：精确确认</text>
  <text x="685" y="512" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">处理压缩混淆后的高价值可疑目标</text>
</svg>
