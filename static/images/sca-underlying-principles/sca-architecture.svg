<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.06"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 6" refX="9.5" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="ar-main" viewBox="0 0 10 6" refX="9.5" refY="3" markerWidth="7" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- 画布背景 -->
  <rect width="880" height="570" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="440" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1e293b">SCA 工具核心架构：四层处理管线</text>

  <!-- ===== Layer 1: 依赖解析 ===== -->
  <rect x="25" y="68" width="830" height="88" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="25" y="68" width="3" height="88" rx="0" fill="#3b82f6" stroke="none"/>
  <text x="42" y="92" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">依赖解析</text>
  <text x="108" y="92" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">│ Manifest → Lock file → 二进制分析，逐级逼近真实依赖图</text>

  <!-- Layer 1 cards: 3 cards, total width = 3*220 + 2*gap = 758, start at x=80 -->
  <rect x="80" y="114" width="220" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="190" y="133" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#1e293b">Manifest 解析 (package.json)</text>

  <rect x="330" y="114" width="220" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="440" y="133" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#1e293b">Lock File 解析 (package-lock)</text>

  <rect x="580" y="114" width="220" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="690" y="133" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#1e293b">二进制分析 (.jar / .whl)</text>

  <!-- Arrow Layer 1 → Layer 2 -->
  <line x1="440" y1="156" x2="440" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="460" y="182" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">组件列表</text>

  <!-- ===== Layer 2: 包指纹 ===== -->
  <rect x="25" y="208" width="830" height="88" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="25" y="208" width="3" height="88" rx="0" fill="#3b82f6" stroke="none"/>
  <text x="42" y="232" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">包指纹识别</text>
  <text x="120" y="232" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">│ 文件哈希 → 片段哈希 → AST 指纹，精度递进确认组件身份</text>

  <rect x="80" y="254" width="220" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="190" y="273" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#1e293b">文件级 SHA-256</text>

  <rect x="330" y="254" width="220" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="440" y="273" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#1e293b">片段级 Winnowing 哈希</text>

  <rect x="580" y="254" width="220" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="690" y="273" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#1e293b">AST 结构指纹</text>

  <!-- Arrow Layer 2 → Layer 3 -->
  <line x1="440" y1="296" x2="440" y2="340" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="460" y="322" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">精确包标识</text>

  <!-- ===== Layer 3: 漏洞匹配 ===== -->
  <rect x="25" y="348" width="830" height="88" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="25" y="348" width="3" height="88" rx="0" fill="#3b82f6" stroke="none"/>
  <text x="42" y="372" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">漏洞与许可证匹配</text>
  <text x="148" y="372" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">│ CPE / PURL / 文件级直连，命名实体对齐决定误报率</text>

  <rect x="80" y="394" width="220" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="190" y="413" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#1e293b">CPE 匹配 (NVD)</text>

  <rect x="330" y="394" width="220" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="440" y="413" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#1e293b">PURL 匹配 (OSV/GitHub)</text>

  <rect x="580" y="394" width="220" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="690" y="413" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#1e293b">许可证分类 (SPDX)</text>

  <!-- Arrow Layer 3 → Layer 4 -->
  <line x1="440" y1="436" x2="440" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="460" y="462" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">漏洞列表 + 许可证清单</text>

  <!-- ===== Layer 4: 可达性分析 ===== -->
  <rect x="25" y="488" width="830" height="68" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="25" y="488" width="3" height="68" rx="0" fill="#3b82f6" stroke="none"/>
  <text x="42" y="512" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">可达性分析与优先级排序</text>
  <text x="176" y="512" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">│ 调用图构建 → 路径可达性判断 → CVSS + 可达性加权排序</text>

  <rect x="150" y="526" width="180" height="20" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="240" y="540" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#2563eb">不可达: 延后处理</text>

  <rect x="380" y="526" width="180" height="20" rx="5" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="470" y="540" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#d97706">可达 + 中危: 排期修复</text>

  <rect x="610" y="526" width="180" height="20" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="700" y="540" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#dc2626">可达 + 高危: 立即修复</text>
</svg>
